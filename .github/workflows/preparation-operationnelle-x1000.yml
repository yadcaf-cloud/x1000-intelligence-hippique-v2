name: X1000 - Preparation operationnelle

on:
  workflow_dispatch:
  push:
    branches:
      - fix/x1000-v2-reparation-controlee
    paths:
      - "moteurs/**"
      - "coordination_x1000.py"
      - "integration_x1000.py"
      - "validation_moteurs.py"
      - "api.py"
      - "tests/**"
      - ".github/workflows/preparation-operationnelle-x1000.yml"
  pull_request:
    paths:
      - "moteurs/**"
      - "coordination_x1000.py"
      - "integration_x1000.py"
      - "validation_moteurs.py"
      - "api.py"
      - "tests/**"
      - ".github/workflows/preparation-operationnelle-x1000.yml"

permissions:
  contents: read

concurrency:
  group: x1000-preparation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preparation:
    name: Controle operationnel M1-M5
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      X1000_DATA_DIR: ${{ runner.temp }}/x1000-data

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer dependances
        run: |
          python -m pip install \
            "fastapi>=0.110,<1" \
            "httpx>=0.27,<1" \
            "pytest>=8,<10"

      - name: Preparer environnement isole
        run: mkdir -p "$X1000_DATA_DIR"

      - name: Verifier fichiers essentiels
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            api.py \
            coordination_x1000.py \
            integration_x1000.py \
            validation_moteurs.py \
            moteurs/noyau_commun.py \
            moteurs/m{1..5}.py \
            tests/test_regression_x1000_m1_m5.py
          do
            test -s "$f" || {
              echo "Fichier absent : $f"
              exit 1
            }
          done

      - name: Controler syntaxe Python
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          paths = [
              Path(n) for n in (
                  'api.py',
                  'coordination_x1000.py',
                  'integration_x1000.py',
                  'validation_moteurs.py'
              )
          ]
          paths += sorted(Path('moteurs').glob('*.py'))
          paths += sorted(Path('tests').glob('test_*.py'))

          for p in paths:
              ast.parse(
                  p.read_text(encoding='utf-8-sig'),
                  filename=str(p)
              )
              print('SYNTAXE OK:', p)
          PY

      - name: Tester moteurs M1-M5
        run: |
          python - <<'PY'
          import importlib

          for i in range(1, 6):
              module = importlib.import_module(f'moteurs.m{i}')
              assert module.MOTEUR == f'M{i}'
              assert module.POIDS and module.CHAMP
              print('MOTEUR OK:', module.MOTEUR)
          PY

      - name: Controler coordination centrale
        run: |
          python - <<'PY'
          import importlib

          for name in (
              'validation_moteurs',
              'coordination_x1000',
              'integration_x1000'
          ):
              importlib.import_module(name)
              print('MODULE OK:', name)
          PY

      - name: Controler six routes API
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from api import app

          with TestClient(app) as client:
              for name in (
                  'status',
                  'courses',
                  'selections',
                  'figes',
                  'audits',
                  'diagnostic'
              ):
                  response = client.get(f'/api/{name}')
                  assert response.status_code == 200, (
                      name, response.status_code
                  )
                  assert isinstance(response.json(), dict)
                  print('API OK:', name)

              status = client.get('/api/status').json()

              assert status['mode'] == 'LECTURE_SEULE_WEB'
              assert all(
                  f'M{i}' in status['moteurs']
                  for i in range(1, 6)
              )
              assert status['figes_automatiques'] is False
              assert status['publication_automatique'] is False

              for method in ('post', 'put', 'patch', 'delete'):
                  response = getattr(client, method)(
                      '/api/figes',
                      json={}
                  )
                  assert response.status_code == 405
          PY

      - name: Executer tests de regression
        run: |
          python -m pytest \
            tests/test_regression_x1000_m1_m5.py -v

      - name: Executer tests de securite
        run: |
          python -m pytest \
            tests/test_securite_integration_x1000.py -v

      - name: Executer tests de coordination
        run: |
          python -m pytest \
            tests/test_coordination_centrale_x1000.py \
            tests/test_coordination_renforcee_x1000.py -v

      - name: Executer tests de preparation
        run: |
          python -m pytest \
            tests/test_preparation_exploitation_x1000.py -v

      - name: Executer tests fonctionnels
        run: |
          python -m pytest \
            tests/test_fonctionnel_moteurs_x1000.py \
            tests/test_fonctionnel_reel_m1_m5.py \
            tests/test_fonctionnel_x1000.py -v

      - name: Verifier integrite des fichiers suivis
        if: always()
        shell: bash
        run: |
          git diff --exit-code
          git diff --cached --exit-code

      - name: Bilan preparation X1000
        if: success()
        run: |
          echo "X1000 : controles operationnels termines"
          echo "M1-M5 : controles executes"
          echo "Coordination centrale : controle execute"
          echo "API : controle execute"
          echo "FIGES et archives : aucune modification demandee"
