name: "X1000 V2.4 - Reparation controlee M1-M5"

run-name: "X1000 V2.4 - Audit sans publication"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x1000-v24-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit-x1000:
    name: "Audit technique M1 a M5"
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHON: python3

    defaults:
      run:
        shell: bash

    steps:
      # 1. Recuperation securisee
      - name: "Recuperer le depot"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          clean: true

      # 2. Python
      - name: "Installer Python 3.12"
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 3. Controle du script
      - name: "Verifier le script Bash"
        run: |
          set -Eeuo pipefail

          SCRIPT="scripts/reparation_controlee_x1000_v24.sh"

          test -f "$SCRIPT"
          bash -n "$SCRIPT"

          echo "Script present et syntaxe valide"

      # 4. Controle initial
      - name: "Verifier le depot initial"
        run: |
          set -Eeuo pipefail

          test -z "$(git status --porcelain --untracked-files=all)"

          echo "Depot initial propre"

      # 5. Empreintes originales
      - name: "Memoriser les empreintes"
        run: |
          set -Eeuo pipefail

          git ls-files -z |
            xargs -0 -r sha256sum \
            > "$RUNNER_TEMP/x1000-originals.sha256"

          echo "Empreintes enregistrees"

      # 6. Audit isole
      - name: "Executer l'audit securise"
        id: audit
        run: |
          set -Eeuo pipefail

          bash scripts/reparation_controlee_x1000_v24.sh

          echo "Audit termine avec succes"

      # 7. Verification des originaux
      - name: "Verifier l'integrite"
        if: always()
        run: |
          set -Eeuo pipefail

          test -f "$RUNNER_TEMP/x1000-originals.sha256"

          sha256sum -c \
            "$RUNNER_TEMP/x1000-originals.sha256"

          git diff --exit-code HEAD --
          git diff --cached --exit-code HEAD --

          test -z "$(git ls-files --others --exclude-standard)"

          echo "Originaux et archives suivies inchanges"

      # 8. Verification branche
      - name: "Verifier la branche"
        if: ${{ steps.audit.outcome == 'success' }}
        run: |
          set -Eeuo pipefail

          BRANCHE="${GITHUB_REF_NAME}"

          echo "Branche auditee : $BRANCHE"
          echo "Aucun changement de branche"
          echo "Aucun commit"
          echo "Aucun push"

      # 9. Synthese
      - name: "Bilan de securite"
        if: always()
        env:
          AUDIT_RESULT: ${{ steps.audit.outcome }}
        run: |
          {
            echo "## X1000 V2.4 - Audit securise"
            echo ""
            echo "- Depot distant : lecture seule"
            echo "- Commit automatique : aucun"
            echo "- Push automatique : aucun"
            echo "- Publication : aucune"
            echo "- FIGE automatique : aucun"
            echo "- Collecte PMU : aucune par le script audite"
            echo "- Moteurs executes : aucun"
            echo "- Archives suivies : integrite controlee"
            echo "- Copies : environnement temporaire"
            echo ""
            echo "Resultat de l'audit : $AUDIT_RESULT"
            echo ""
            echo "Aucune validation officielle PMU."
          } >> "$GITHUB_STEP_SUMMARY"
