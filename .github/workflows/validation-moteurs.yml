name: X1000 - Validation independante M1-M5

on:
  workflow_dispatch:
  push:
    branches:
      - fix/x1000-v2-reparation-controlee
    paths:
      - "moteurs/**"
      - ".github/workflows/validation-moteurs.yml"

permissions:
  contents: read

jobs:
  validation:
    if: github.ref == 'refs/heads/fix/x1000-v2-reparation-controlee'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      TZ: Europe/Paris

    steps:
      - name: Checkout securise
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verifier M1-M5
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$RUNNER_TEMP/x1000-validation"
          git archive HEAD | tar -xf - \
            -C "$RUNNER_TEMP/x1000-validation"

          cd "$RUNNER_TEMP/x1000-validation"

          python -B - <<'PY'
          import ast
          import importlib
          from pathlib import Path

          for i in range(1, 6):
              name = f"moteurs/m{i}.py"
              path = Path(name)

              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f"Absent: {name}")

              ast.parse(
                  path.read_text(encoding="utf-8-sig"),
                  filename=name
              )

              module = importlib.import_module(
                  f"moteurs.m{i}"
              )

              if getattr(module, "MOTEUR", None) != f"M{i}":
                  raise SystemExit("Identite invalide")

              if not callable(
                  getattr(module, "analyser_course", None)
              ):
                  raise SystemExit("Interface invalide")

              if getattr(module, "COUVERTURE_MIN", None) != 1.0:
                  raise SystemExit("Configuration inattendue")

              print(f"M{i}: interface conforme")
          PY

      - name: Verifier integrite
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "$(git status --porcelain)"

      - name: Bilan
        if: success()
        run: |
          echo "M1-M5 : interfaces verifiees" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "Aucune publication ni FIGE" \
            >> "$GITHUB_STEP_SUMMARY"
