name: X1000 - Test fonctionnel reel M1-M5

on:
  workflow_dispatch:
  push:
    branches:
      - fix/x1000-v2-reparation-controlee
    paths:
      - "moteurs/**"
      - "tests/**"
      - ".github/workflows/test-fonctionnel-reel-m1-m5.yml"

permissions:
  contents: read

concurrency:
  group: x1000-test-reel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    name: X1000 - Technique et reel separes
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      X1000_READ_ONLY: "1"
      X1000_NO_FIGE: "1"
      X1000_NO_PUBLICATION: "1"

    steps:
      - name: Recuperer branche de reparation
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verifier branche et fichiers
        shell: bash
        run: |
          set -euo pipefail

          test "$GITHUB_REF_NAME" = \
            "fix/x1000-v2-reparation-controlee"

          for m in m1 m2 m3 m4 m5; do
            test -f "moteurs/$m.py"
          done

          test -f moteurs/noyau_commun.py
          test -f tests/test_fonctionnel_reel_m1_m5.py

          echo "Branche et fichiers verifies"

      - name: Autotests techniques M1 a M5
        id: technique
        shell: bash
        run: |
          set -euo pipefail

          python -B - <<'PY'
          import os
          import tempfile
          from tests.test_fonctionnel_reel_m1_m5 import (
              protection,
              tester_moteurs,
          )

          with tempfile.TemporaryDirectory() as dossier:
              os.chdir(dossier)
              with protection():
                  resultats = tester_moteurs()

          if resultats:
              raise SystemExit(
                  "Autotests : resultat inattendu"
              )

          print("AUTOTESTS TECHNIQUES : REUSSIS")
          PY

          echo "statut=REUSSIS" >> "$GITHUB_OUTPUT"

      - name: Detecter les courses attestees
        id: courses
        shell: bash
        run: |
          set -euo pipefail

          python -B - <<'PY'
          import os
          from pathlib import Path

          dossier = Path("tests/donnees_reelles")
          fichiers = sorted(dossier.glob("*.json"))

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as sortie:
              sortie.write(
                  f"nombre={len(fichiers)}\n"
              )
              sortie.write(
                  "presentes="
                  + ("true" if fichiers else "false")
                  + "\n"
              )

          if not fichiers:
              print(
                  "::notice::Tests reels NON EXECUTES : "
                  "aucune fixture disponible."
              )
          else:
              print(
                  "Fixtures trouvees :", len(fichiers)
              )
          PY

      - name: Tester les courses reelles M1 a M5
        id: reel
        if: steps.courses.outputs.presentes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python -B - <<'PY'
          import os
          import tempfile
          from pathlib import Path
          from tests.test_fonctionnel_reel_m1_m5 import (
              FIXTURES,
              MOTEURS,
              charger_fixture,
              protection,
              tester_moteurs,
          )

          fichiers = sorted(FIXTURES.glob("*.json"))
          if not fichiers:
              raise SystemExit("Aucune course reelle")

          analyses = 0

          with tempfile.TemporaryDirectory() as dossier:
              os.chdir(dossier)

              with protection():
                  for fichier in fichiers:
                      course, actifs = charger_fixture(
                          fichier
                      )

                      resultats = tester_moteurs(
                          course, actifs
                      )

                      if set(resultats) != set(MOTEURS):
                          raise SystemExit(
                              "Moteurs incomplets"
                          )

                      for nom in MOTEURS:
                          statut = resultats[nom]["statut"]
                          if statut != "ANALYSE_DISPONIBLE":
                              raise SystemExit(
                                  f"{nom} : {statut}"
                              )
                          analyses += 1

                      print(
                          "COURSE VALIDEE :", fichier.name
                      )

          attendu = len(fichiers) * len(MOTEURS)

          if analyses != attendu:
              raise SystemExit(
                  "Nombre d'analyses incorrect"
              )

          print(
              "ANALYSES REELLES REUSSIES :",
              analyses
          )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as sortie:
              sortie.write("statut=REUSSIS\n")
              sortie.write(
                  f"analyses={analyses}\n"
              )
          PY

      - name: Verifier absence de modifications
        id: integrite
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          git diff --exit-code
          git diff --cached --exit-code

          test -z "$(
            git ls-files --others --exclude-standard
          )"

          echo "Depot de travail intact"

      - name: Bilan final X1000
        if: always()
        shell: bash
        env:
          TECHNIQUE: ${{ steps.technique.outcome }}
          COURSES: ${{ steps.courses.outputs.nombre }}
          PRESENTES: ${{ steps.courses.outputs.presentes }}
          REEL: ${{ steps.reel.outcome }}
          ANALYSES: ${{ steps.reel.outputs.analyses }}
          INTEGRITE: ${{ steps.integrite.outcome }}
        run: |
          {
            echo "## X1000 - Bilan M1 a M5"
            echo ""
            echo "| Controle | Resultat |"
            echo "|---|---|"
            echo "| Autotests techniques | $TECHNIQUE |"
            echo "| Fixtures detectees | ${COURSES:-0} |"
            echo "| Tests reels | $REEL |"
            echo "| Analyses reelles | ${ANALYSES:-0} |"
            echo "| Integrite depot | $INTEGRITE |"
            echo ""

            if [[ "$PRESENTES" != "true" ]]; then
              echo "### TESTS REELS NON EXECUTES"
              echo ""
              echo "Aucune course reelle attestee disponible."
              echo "Succes technique uniquement."
            elif [[ "$REEL" == "success" ]]; then
              echo "### ANALYSES REELLES REUSSIES"
              echo ""
              echo "M1 a M5 : classements complets valides."
              echo "Attestations non verifiees en ligne."
            else
              echo "### TESTS REELS NON VALIDES"
              echo ""
              echo "Consulter les erreurs du job."
            fi

            echo ""
            echo "- Branche de reparation uniquement"
            echo "- Lecture seule"
            echo "- Aucun FIGE"
            echo "- Aucune publication"
            echo "- Aucune collecte PMU automatique"
          } >> "$GITHUB_STEP_SUMMARY"
