name: X1000 - Preparation operationnelle

on:
  workflow_dispatch:
  push:
    branches:
      - fix/x1000-v2-reparation-controlee
    paths:
      - "moteurs/**"
      - "coordination_x1000.py"
      - "integration_x1000.py"
      - "validation_moteurs.py"
      - "api.py"
      - "tests/**"
      - "**/index.html"
      - "**/pmu.html"
      - "**/dashboard_x1000.html"
      - ".github/workflows/preparation-operationnelle-x1000.yml"

permissions:
  contents: read

jobs:
  preparation:
    name: Controle operationnel M1-M5
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Diagnostiquer les fichiers HTML
        shell: bash
        run: |
          set -eu

          echo "Branche : $GITHUB_REF_NAME"
          echo "Repertoire : $PWD"
          echo "Fichiers HTML presents :"

          find . -type f \( \
            -name 'index.html' -o \
            -name 'pmu.html' -o \
            -name 'dashboard_x1000.html' \
          \) -print

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer dependances API
        run: |
          python -m pip install \
            "fastapi>=0.110,<1" \
            "httpx>=0.27,<1"

      - name: Verifier les fichiers essentiels
        run: |
          set -eu

          for fichier in \
            coordination_x1000.py \
            integration_x1000.py \
            validation_moteurs.py \
            moteurs/noyau_commun.py \
            moteurs/m1.py \
            moteurs/m2.py \
            moteurs/m3.py \
            moteurs/m4.py \
            moteurs/m5.py \
            api.py
          do
            test -f "$fichier" || {
              echo "ERREUR: fichier absent: $fichier"
              exit 1
            }
            echo "OK: $fichier"
          done

      - name: Verifier syntaxe Python
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          fichiers = [
              Path("coordination_x1000.py"),
              Path("integration_x1000.py"),
              Path("validation_moteurs.py"),
              Path("api.py"),
              *Path("moteurs").glob("*.py"),
              *Path("tests").glob("test_*.py"),
          ]

          for fichier in fichiers:
              ast.parse(
                  fichier.read_text(encoding="utf-8"),
                  filename=str(fichier),
              )
              print("OK:", fichier)
          PY

      - name: Tester les cinq moteurs
        run: |
          python - <<'PY'
          import integration_x1000 as x

          moteurs = x.charger_moteurs()

          assert set(moteurs) == {
              "M1", "M2", "M3", "M4", "M5"
          }

          course = x.creer_course_test()
          resultat = x.executer_integration(course)

          assert resultat["nombre_moteurs"] == 5
          assert resultat["coordination_complete"]

          predictions = resultat[
              "predictions_independantes"
          ]

          assert set(predictions) == set(moteurs)

          for classement in predictions.values():
              assert len(classement) == 5
              assert len(set(classement)) == 5
              assert 7 not in classement

          protections = (
              "publication_autorisee",
              "fige_officiel",
              "fige_automatique",
              "validation_officielle",
              "archives_modifiees",
          )

          for protection in protections:
              assert resultat[protection] is False

          print("Integration M1-M5 : OK")
          PY

      - name: Executer tests de regression
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_*.py" \
            -v

      - name: Verifier les routes API
        run: |
          python - <<'PY'
          from api import app

          attendues = {
              "/api/status",
              "/api/courses",
              "/api/selections",
              "/api/figes",
              "/api/audits",
              "/api/diagnostic",
          }

          routes = {
              route.path: route.methods
              for route in app.routes
          }

          assert attendues <= set(routes)

          for chemin in attendues:
              methodes = routes[chemin]

              assert "GET" in methodes
              assert "POST" not in methodes
              assert "PUT" not in methodes
              assert "PATCH" not in methodes
              assert "DELETE" not in methodes

          print("Routes API : OK")
          PY

      - name: Verifier les pages HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser

          class ControleHTML(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tags = set()
                  self.links = []

              def handle_starttag(self, tag, attrs):
                  self.tags.add(tag)

                  if tag == "a":
                      href = dict(attrs).get("href")
                      if href:
                          self.links.append(href)

          racine = Path(".")

          noms = (
              "index.html",
              "pmu.html",
              "dashboard_x1000.html",
          )

          chemins = {}

          for nom in noms:
              trouves = sorted(
                  p for p in racine.rglob(nom)
                  if p.is_file()
                  and ".git" not in p.parts
              )
              chemins[nom] = trouves

              if not trouves:
                  print(
                      f"ATTENTION: {nom} absent"
                  )
              else:
                  for fichier in trouves:
                      print(
                          f"TROUVE: {fichier}"
                      )

          for nom, fichiers in chemins.items():
              for fichier in fichiers:
                  contenu = fichier.read_text(
                      encoding="utf-8-sig"
                  )

                  parser = ControleHTML()
                  parser.feed(contenu)
                  parser.close()

                  for tag in ("html", "head", "body"):
                      if tag not in parser.tags:
                          raise SystemExit(
                              f"ERREUR: {fichier}: "
                              f"balise {tag} absente"
                          )

                  if not contenu.strip().lower().endswith(
                      "</html>"
                  ):
                      raise SystemExit(
                          f"ERREUR: {fichier}: "
                          "fin HTML absente"
                      )

                  print(
                      f"HTML valide structurellement: "
                      f"{fichier}"
                  )

          index_presents = chemins["index.html"]
          pmu_presents = chemins["pmu.html"]

          if not index_presents:
              print(
                  "ATTENTION: index.html introuvable. "
                  "Verifier son emplacement."
              )

          if not pmu_presents:
              print(
                  "ATTENTION: pmu.html introuvable. "
                  "Verifier son emplacement."
              )

          print("Controle HTML termine")
          PY

      - name: Inventorier tableau de bord
        run: |
          python - <<'PY'
          from pathlib import Path

          candidats = [
              Path("dashboard_x1000.html"),
              Path("index.html"),
              Path("docs/index.html"),
              Path(
                  ".github/workflows/"
                  "dashboard_x1000.html"
              ),
          ]

          presents = [
              p for p in candidats if p.is_file()
          ]

          if not presents:
              print(
                  "ATTENTION: aucun tableau de bord "
                  "aux emplacements habituels"
              )
          else:
              for p in presents:
                  print(
                      "Tableau de bord trouve:", p
                  )

          print(
              "Integration navigateur/API : "
              "non verifiee par ce workflow"
          )
          PY

      - name: Controle final
        run: |
          echo "Audit technique termine"
          echo "Controle HTML termine"
          echo "Verification moteurs M1-M5 terminee"
          echo "Verification coordination terminee"
          echo "Verification API terminee"
          echo "Aucune collecte PMU"
          echo "Aucun FIGE automatique"
          echo "Aucune publication"
          echo "Aucune modification des archives"
