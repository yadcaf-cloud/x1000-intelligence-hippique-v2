name: X1000 - Test fonctionnel reel M1-M5

on:
  workflow_dispatch:
  push:
    branches:
      - fix/x1000-v2-reparation-controlee
    paths:
      - "moteurs/**"
      - "tests/**"
      - ".github/workflows/test-fonctionnel-reel-m1-m5.yml"

permissions:
  contents: read

concurrency:
  group: x1000-reel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    name: X1000 - Diagnostic M1 a M5
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      X1000_READ_ONLY: "1"
      X1000_NO_FIGE: "1"
      X1000_NO_PUBLICATION: "1"

    steps:
      - name: Recuperer la branche
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verifier la branche
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = \
            "fix/x1000-v2-reparation-controlee"

          for m in m1 m2 m3 m4 m5; do
            test -f "moteurs/$m.py"
          done

          test -f moteurs/noyau_commun.py
          test -f tests/test_fonctionnel_reel_m1_m5.py
          test -f tests/valider_donnees_reelles.py

      - name: Autotests techniques
        id: technique
        shell: bash
        run: |
          set -euo pipefail

          python -B - <<'PY'
          import os
          import tempfile
          from tests.test_fonctionnel_reel_m1_m5 import (
              protection,
              tester_moteurs,
          )

          with tempfile.TemporaryDirectory() as d:
              ancien = os.getcwd()
              try:
                  os.chdir(d)
                  with protection():
                      resultats = tester_moteurs()
              finally:
                  os.chdir(ancien)

          if resultats:
              raise SystemExit(
                  "Autotests techniques incoherents"
              )

          print("M1-M5 : AUTOTESTS REUSSIS")
          PY

      - name: Detecter les donnees attestees
        id: donnees
        shell: bash
        run: |
          set -euo pipefail

          python -B - <<'PY'
          import os
          from pathlib import Path

          dossier = Path("tests/donnees_reelles")
          fichiers = sorted(dossier.glob("*.json"))

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as sortie:
              sortie.write(
                  f"nombre={len(fichiers)}\n"
              )
              sortie.write(
                  "presentes="
                  + ("true" if fichiers else "false")
                  + "\n"
              )

          if not fichiers:
              print(
                  "::notice::Aucune course attestee. "
                  "Tests reels non executes."
              )
          else:
              print(
                  "Courses candidates :", len(fichiers)
              )
          PY

      - name: Valider les courses
        id: validation
        if: steps.donnees.outputs.presentes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/valider_donnees_reelles.py

      - name: Analyses reelles M1 a M5
        id: reel
        if: >-
          ${{
            steps.donnees.outputs.presentes == 'true'
            && steps.validation.outcome == 'success'
          }}
        shell: bash
        run: |
          set -euo pipefail

          python -B - <<'PY'
          import os
          import tempfile
          from tests.test_fonctionnel_reel_m1_m5 import (
              FIXTURES,
              MOTEURS,
              charger_fixture,
              protection,
              tester_moteurs,
          )

          fichiers = sorted(FIXTURES.glob("*.json"))

          if not fichiers:
              raise SystemExit("Aucune course")

          analyses = 0
          ancien = os.getcwd()

          try:
              with tempfile.TemporaryDirectory() as d:
                  os.chdir(d)

                  with protection():
                      for fichier in fichiers:
                          course, actifs = charger_fixture(
                              fichier
                          )

                          resultats = tester_moteurs(
                              course, actifs
                          )

                          if set(resultats) != set(MOTEURS):
                              raise AssertionError(
                                  "Moteurs incomplets"
                              )

                          for nom in MOTEURS:
                              statut = resultats[nom]["statut"]

                              if statut != "ANALYSE_DISPONIBLE":
                                  raise AssertionError(
                                      f"{nom}: {statut}"
                                  )

                              if len(
                                  resultats[nom]["numeros"]
                              ) != 5:
                                  raise AssertionError(
                                      f"{nom}: classement incomplet"
                                  )

                              analyses += 1

                          print(
                              "COURSE ANALYSEE :",
                              course["id"]
                          )
          finally:
              os.chdir(ancien)

          attendu = len(fichiers) * len(MOTEURS)

          if analyses != attendu:
              raise AssertionError(
                  "Nombre d'analyses incorrect"
              )

          print("ANALYSES REUSSIES :", analyses)

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as sortie:
              sortie.write(
                  f"analyses={analyses}\n"
              )
          PY

      - name: Verifier integrite du depot
        id: integrite
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          git diff --exit-code
          git diff --cached --exit-code

          test -z "$(
            git ls-files --others --exclude-standard
          )"

          echo "DEPOT INTACT"

      - name: Bilan X1000
        if: always()
        shell: bash
        env:
          TECHNIQUE: ${{ steps.technique.outcome }}
          NOMBRE: ${{ steps.donnees.outputs.nombre }}
          PRESENTES: ${{ steps.donnees.outputs.presentes }}
          VALIDATION: ${{ steps.validation.outcome }}
          REEL: ${{ steps.reel.outcome }}
          ANALYSES: ${{ steps.reel.outputs.analyses }}
          INTEGRITE: ${{ steps.integrite.outcome }}
        run: |
          {
            echo "## X1000 - Bilan M1-M5"
            echo ""
            echo "| Controle | Resultat |"
            echo "|---|---|"
            echo "| Technique | $TECHNIQUE |"
            echo "| Courses | ${NOMBRE:-0} |"
            echo "| Validation | $VALIDATION |"
            echo "| Analyses reelles | $REEL |"
            echo "| Nombre analyses | ${ANALYSES:-0} |"
            echo "| Integrite | $INTEGRITE |"
            echo ""

            if [[ "$PRESENTES" != "true" ]]; then
              echo "Tests reels non executes."
              echo "Aucune fixture attestee."
            elif [[ "$REEL" == "success" ]]; then
              echo "Tests fonctionnels reels reussis."
              echo "Authenticite externe non controlee en ligne."
            else
              echo "Tests reels non valides."
            fi

            echo ""
            echo "- Aucun FIGE"
            echo "- Aucune publication"
            echo "- Aucune collecte PMU"
            echo "- Archives non modifiees"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Statut final
        if: always()
        shell: bash
        env:
          TECHNIQUE: ${{ steps.technique.outcome }}
          PRESENTES: ${{ steps.donnees.outputs.presentes }}
          VALIDATION: ${{ steps.validation.outcome }}
          REEL: ${{ steps.reel.outcome }}
          INTEGRITE: ${{ steps.integrite.outcome }}
        run: |
          set -euo pipefail

          test "$TECHNIQUE" = "success"
          test "$INTEGRITE" = "success"

          if [[ "$PRESENTES" == "true" ]]; then
            test "$VALIDATION" = "success"
            test "$REEL" = "success"
          else
            echo "::notice::Succes technique uniquement"
          fi

          echo "CONTROLES X1000 TERMINES"
