name: X1000 V2 - Verification tableau de bord

on:
  workflow_dispatch:
  push:
    branches:
      - fix/x1000-v2-reparation-controlee
    paths:
      - "api.py"
      - "index.html"
      - "pmu.html"
      - ".github/workflows/dashboard_x1000.html"
      - ".github/workflows/verification-tableau-bord-x1000-v2.yml"

permissions:
  contents: read

concurrency:
  group: x1000-dashboard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verification:
    name: Diagnostic API et tableau de bord
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      X1000_READ_ONLY: "1"
      X1000_NO_FIGE: "1"
      X1000_NO_PUBLICATION: "1"

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Installer les dependances
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            "fastapi>=0.115,<1" \
            "httpx>=0.27,<1"

      - name: Preparer les donnees isolees
        shell: bash
        run: |
          set -euo pipefail
          echo "X1000_DATA_DIR=$RUNNER_TEMP/x1000-data" \
            >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/x1000-data"

      - name: Verifier les pages HTML
        shell: bash
        run: |
          set -euo pipefail

          python -B - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser

          class ControleHTML(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tags = set()

              def handle_starttag(self, tag, attrs):
                  self.tags.add(tag.lower())

          dashboard = Path(
              ".github/workflows/dashboard_x1000.html"
          )

          if not dashboard.is_file():
              raise SystemExit(
                  "ERREUR: tableau de bord obligatoire absent"
              )

          pages = [dashboard]

          # Pages facultatives : verifier uniquement
          # celles qui existent reellement.
          for nom in ("index.html", "pmu.html"):
              fichier = Path(nom)
              if fichier.is_file():
                  pages.append(fichier)
              else:
                  print(
                      f"INFO: {nom} absent, "
                      "controle facultatif ignore"
                  )

          for fichier in pages:
              contenu = fichier.read_text(
                  encoding="utf-8-sig"
              )

              parser = ControleHTML()
              parser.feed(contenu)
              parser.close()

              for tag in ("html", "head", "body"):
                  if tag not in parser.tags:
                      raise SystemExit(
                          f"ERREUR: {fichier}: "
                          f"balise {tag} absente"
                      )

              if not contenu.strip().lower().endswith(
                  "</html>"
              ):
                  raise SystemExit(
                      f"ERREUR: {fichier}: "
                      "fin HTML absente"
                  )

              print(f"OK: {fichier}")

          contenu_dashboard = dashboard.read_text(
              encoding="utf-8-sig"
          )

          for moteur in (
              "M1", "M2", "M3", "M4", "M5"
          ):
              if moteur not in contenu_dashboard:
                  raise SystemExit(
                      f"ERREUR: reference {moteur} "
                      "absente du tableau de bord"
                  )

          print("Controle HTML termine : OK")
          PY

      - name: Verifier API et moteurs
        shell: bash
        run: |
          set -euo pipefail

          python -B - <<'PY'
          from fastapi.testclient import TestClient
          from api import app

          routes = (
              "/api/status",
              "/api/courses",
              "/api/selections",
              "/api/figes",
              "/api/audits",
              "/api/diagnostic",
          )

          with TestClient(app) as client:
              for route in routes:
                  response = client.get(route)

                  assert response.status_code == 200, (
                      route,
                      response.status_code
                  )

                  assert isinstance(
                      response.json(), dict
                  ), route

                  print(f"OK: GET {route}")

              status = client.get(
                  "/api/status"
              ).json()

              moteurs = status.get("moteurs")

              assert isinstance(moteurs, dict), (
                  "Statuts moteurs invalides"
              )

              assert set(moteurs) == {
                  "M1", "M2", "M3", "M4", "M5"
              }, "References M1-M5 incompletes"

              for nom in (
                  "M1", "M2", "M3", "M4", "M5"
              ):
                  moteur = moteurs[nom]

                  assert isinstance(moteur, dict), nom
                  assert moteur.get("moteur") == nom, nom

                  print(f"OK: reference {nom}")

              for cle in (
                  "collecte_automatique",
                  "figes_automatiques",
                  "publication_automatique",
                  "validation_officielle_automatique",
              ):
                  assert status.get(cle) is False, (
                      f"Protection invalide: {cle}"
                  )

              assert status.get("mode") == (
                  "LECTURE_SEULE_WEB"
              )

              diagnostic = client.get(
                  "/api/diagnostic"
              ).json()

              regles = diagnostic.get("regles", {})

              for cle in (
                  "collecte_pmu",
                  "fige_automatique",
                  "audit_automatique",
                  "publication_distante",
                  "modification_archives",
              ):
                  assert regles.get(cle) is False, (
                      f"Regle invalide: {cle}"
                  )

              for route in routes:
                  for methode in (
                      "POST",
                      "PUT",
                      "PATCH",
                      "DELETE",
                  ):
                      response = client.request(
                          methode, route
                      )

                      assert response.status_code == 405, (
                          route,
                          methode,
                          response.status_code
                      )

              print("API lecture seule : OK")
              print("References M1 a M5 : OK")
              print("Protections FIGES et archives : OK")
          PY

      - name: Verifier absence de modification
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          git diff --exit-code HEAD --
          git diff --cached --exit-code HEAD --

          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "ERREUR: fichiers non suivis detectes"
            git ls-files --others --exclude-standard
            exit 1
          fi

          echo "Depot inchange : OK"

      - name: Publier le diagnostic
        if: always()
        shell: bash
        run: |
          {
            echo "## X1000 Intelligence Hippique V2"
            echo ""
            echo "Statut du job : ${{ job.status }}"
            echo ""
            echo "### Controles demandes"
            echo ""
            echo "- Tableau de bord HTML obligatoire"
            echo "- Pages HTML facultatives si presentes"
            echo "- Six routes API en lecture seule"
            echo "- References des moteurs M1 a M5"
            echo "- Protection des methodes HTTP"
            echo "- Desactivation des automatismes interdits"
            echo "- Verification du depot inchange"
            echo ""
            echo "### Restrictions"
            echo ""
            echo "- Aucun FIGE genere"
            echo "- Aucune archive modifiee"
            echo "- Aucun pronostic modifie"
            echo "- Aucun commit ou push automatique"
            echo "- Aucun deploiement automatique"
            echo "- Aucune publication automatique"
            echo ""
            echo "Les controles non executes ou echoues"
            echo "ne sont pas consideres comme valides."
          } >> "$GITHUB_STEP_SUMMARY"
