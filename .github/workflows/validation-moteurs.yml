name: "X1000 V2.4 - Validation securisee M1-M5"

on:
  workflow_dispatch:

  push:
    branches:
      - feature/installation-x1000-v2
    paths:
      - "M1.py"
      - "m1.py"
      - "m2.py"
      - "m3.py"
      - "m4.py"
      - "m5.py"
      - "moteurs/**"
      - "tests/**"
      - "test_*.py"
      - "validation_moteurs.py"
      - "coordination_x1000.py"
      - "config_x1000.py"
      - ".github/workflows/validation-moteurs.yml"

permissions:
  contents: read

concurrency:
  group: x1000-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    name: "Controle M1-M5 sans publication"
    if: github.ref == 'refs/heads/feature/installation-x1000-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONPATH: "."

    steps:
      - name: Recuperer la branche securisee
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verifier la branche
        shell: bash
        run: |
          set -euo pipefail

          test "$GITHUB_REF" = \
            "refs/heads/feature/installation-x1000-v2"

          test "$(git branch --show-current)" = \
            "feature/installation-x1000-v2"

          echo "Branche securisee confirmee"

      - name: Controler la syntaxe Python
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          exclus = {
              "venv",
              ".venv",
              "__pycache__",
              "node_modules",
              "site-packages",
          }

          fichiers = sorted(
              p for p in Path(".").rglob("*.py")
              if not any(
                  part.startswith(".") or part in exclus
                  for part in p.parts
              )
          )

          if not fichiers:
              raise RuntimeError(
                  "Aucun fichier Python trouve"
              )

          for fichier in fichiers:
              contenu = fichier.read_text(
                  encoding="utf-8-sig"
              )
              ast.parse(
                  contenu,
                  filename=str(fichier)
              )
              print("SYNTAXE OK:", fichier)

          print(
              f"{len(fichiers)} fichiers controles"
          )
          PY

      - name: Verifier les cinq moteurs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          racine = Path(".")
          dossier = Path("moteurs")

          emplacements = []

          for numero in range(1, 6):
              noms = [
                  f"m{numero}.py",
                  f"M{numero}.py",
              ]

              candidats = [
                  base / nom
                  for base in (dossier, racine)
                  for nom in noms
                  if (base / nom).is_file()
              ]

              if not candidats:
                  raise RuntimeError(
                      f"Moteur M{numero} absent"
                  )

              for fichier in candidats:
                  if fichier.stat().st_size == 0:
                      raise RuntimeError(
                          f"Moteur vide: {fichier}"
                      )

              choisi = candidats[0]
              emplacements.append(choisi)

              print(
                  f"M{numero}: presence OK - {choisi}"
              )

              if len(candidats) > 1:
                  print(
                      "AVERTISSEMENT: versions multiples:",
                      ", ".join(map(str, candidats))
                  )

          noyau = dossier / "noyau_commun.py"

          if noyau.is_file():
              if noyau.stat().st_size == 0:
                  raise RuntimeError(
                      "Noyau commun vide"
                  )
              print("Noyau commun present")
          else:
              print(
                  "Noyau commun non present: "
                  "dependances a verifier par les tests"
              )

          print("Cinq moteurs reperes")
          PY

      - name: Verifier les composants centraux
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          requis = [
              "validation_moteurs.py",
              "coordination_x1000.py",
              "config_x1000.py",
          ]

          for nom in requis:
              fichier = Path(nom)

              if not fichier.is_file():
                  raise RuntimeError(
                      f"Fichier requis absent: {nom}"
                  )

              if fichier.stat().st_size == 0:
                  raise RuntimeError(
                      f"Fichier vide: {nom}"
                  )

              print("COMPOSANT OK:", nom)
          PY

      - name: Executer les tests Python
        shell: bash
        run: |
          python - <<'PY'
          import sys
          import unittest
          from pathlib import Path

          loader = unittest.TestLoader()
          suite = unittest.TestSuite()

          tests_racine = sorted(
              Path(".").glob("test_*.py")
          )

          for fichier in tests_racine:
              suite.addTests(
                  loader.loadTestsFromName(
                      fichier.stem
                  )
              )

          dossier = Path("tests")

          if dossier.is_dir():
              suite.addTests(
                  loader.discover(
                      start_dir=str(dossier),
                      pattern="test_*.py",
                      top_level_dir=str(dossier),
                  )
              )

          nombre = suite.countTestCases()

          if nombre == 0:
              raise RuntimeError(
                  "Aucun test Python executable trouve"
              )

          print(
              f"{nombre} tests decouverts"
          )

          resultat = unittest.TextTestRunner(
              verbosity=2
          ).run(suite)

          if not resultat.wasSuccessful():
              sys.exit(1)

          print("Tests Python reussis")
          PY

      - name: Verifier les modifications locales
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "Etat du depot apres controles"
          git status --short

          if ! git diff --quiet ||
             ! git diff --cached --quiet; then
            echo "::error::Fichiers suivis modifies"
            exit 1
          fi

          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Fichiers non suivis crees"
            exit 1
          fi

          echo "Aucune modification locale detectee"

      - name: Bilan de validation
        if: success()
        shell: bash
        run: |
          {
            echo "## X1000 V2.4"
            echo ""
            echo "Validation technique reussie."
            echo ""
            echo "- Branche securisee uniquement"
            echo "- Syntaxe Python controlee"
            echo "- M1 a M5 reperes"
            echo "- Composants centraux presents"
            echo "- Tests Python executes"
            echo "- Depot sans modification"
            echo "- Aucune publication par le workflow"
            echo "- Aucun commit automatique"
            echo "- Aucun FIGE cree par le workflow"
          } >> "$GITHUB_STEP_SUMMARY"
