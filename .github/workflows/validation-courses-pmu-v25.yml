
name: X1000 V2.5 - Validation courses PMU France

on:
  workflow_dispatch:

  push:
    branches:
      - feature/installation-x1000-v2
    paths:
      - validation_courses_pmu_v25.py
      - audit_collecte_pmu.py
      - .github/workflows/validation-courses-pmu-v25.yml

permissions:
  contents: read

concurrency:
  group: x1000-v25-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    name: Validation France sans publication
    if: github.ref == 'refs/heads/feature/installation-x1000-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONNOUSERSITE: '1'

    steps:
      - name: Recuperer branche securisee
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verifier branche fichiers et syntaxe
        shell: bash
        run: |
          set -euo pipefail

          test "$GITHUB_REF" = \
            'refs/heads/feature/installation-x1000-v2'

          python - <<'PY'
          import ast
          from pathlib import Path

          for name in (
              'audit_collecte_pmu.py',
              'validation_courses_pmu_v25.py',
          ):
              path = Path(name)

              if not path.is_file():
                  raise SystemExit(
                      f'ERREUR : fichier absent : {name}'
                  )

              ast.parse(
                  path.read_text(encoding='utf-8'),
                  filename=name,
              )

              print(f'OK : {name}')

          print('Syntaxe Python conforme')
          PY

      - name: Executer validation PMU
        shell: bash
        run: |
          set -euo pipefail

          python validation_courses_pmu_v25.py \
            > "$RUNNER_TEMP/validation-v25.json"

      - name: Verifier rapport et securite
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import re

          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          def require(condition, message):
              if not condition:
                  raise ValueError(message)

          def unique_pairs(pairs):
              result = {}

              for key, value in pairs:
                  require(
                      key not in result,
                      f'Cle JSON dupliquee : {key}'
                  )
                  result[key] = value

              return result

          def invalid_constant(value):
              raise ValueError(
                  f'Constante JSON interdite : {value}'
              )

          def aware_datetime(value, label):
              require(
                  isinstance(value, str),
                  f'{label} absent'
              )

              try:
                  dt = datetime.fromisoformat(
                      value.replace('Z', '+00:00')
                  )
              except ValueError as exc:
                  raise ValueError(
                      f'{label} invalide'
                  ) from exc

              require(
                  dt.tzinfo is not None
                  and dt.utcoffset() is not None,
                  f'{label} sans fuseau'
              )

              return dt

          report = (
              Path(os.environ['RUNNER_TEMP'])
              / 'validation-v25.json'
          )

          require(
              report.is_file(),
              'Rapport JSON absent'
          )

          require(
              0 < report.stat().st_size <= 2_000_000,
              'Taille rapport invalide'
          )

          data = json.loads(
              report.read_text(encoding='utf-8'),
              object_pairs_hook=unique_pairs,
              parse_constant=invalid_constant,
          )

          require(
              isinstance(data, dict),
              'Rapport JSON non objet'
          )

          require(
              data.get('version') == '2.5',
              'Version invalide'
          )

          require(
              data.get('statut')
              == 'VALIDATION_TECHNIQUE_SANS_PUBLICATION',
              'Statut technique invalide'
          )

          for key in (
              'publication',
              'fige',
              'validation_sportive',
              'transmission_moteurs',
          ):
              require(
                  data.get(key) is False,
                  f'Interdiction non respectee : {key}'
              )

          now = datetime.now(timezone.utc)

          paris_date = now.astimezone(
              ZoneInfo('Europe/Paris')
          ).date()

          require(
              data.get('date') == paris_date.isoformat(),
              'Date PMU incorrecte'
          )

          expected_source = (
              'https://online.turfinfo.api.pmu.fr'
              '/rest/client/1/programme/'
              + paris_date.strftime('%d%m%Y')
          )

          require(
              data.get('source') == expected_source,
              'Source incorrecte'
          )

          digest = data.get('source_sha256')

          require(
              isinstance(digest, str)
              and re.fullmatch(
                  r'[0-9a-f]{64}', digest
              ) is not None,
              'Empreinte SHA256 invalide'
          )

          collected = aware_datetime(
              data.get('collecte_a'),
              'Horodatage collecte'
          )

          require(
              abs((now - collected).total_seconds())
              <= 600,
              'Collecte hors tolerance de 10 minutes'
          )

          require(
              collected.astimezone(
                  ZoneInfo('Europe/Paris')
              ).date() == paris_date,
              'Date locale de collecte incoherente'
          )

          courses = data.get('courses')

          require(
              isinstance(courses, list),
              'Courses invalides'
          )

          require(
              len(courses) <= 150,
              'Plus de 150 courses'
          )

          counts = {
              'OK': 0,
              'PARTIEL': 0,
              'REFUSE': 0,
          }

          ids = set()

          for course in courses:
              require(
                  isinstance(course, dict),
                  'Course non objet'
              )

              cid = course.get('id')

              require(
                  isinstance(cid, str)
                  and re.fullmatch(
                      r'R[1-9]\d*C[1-9]\d*',
                      cid
                  ) is not None,
                  'Identifiant course invalide'
              )

              require(
                  cid not in ids,
                  f'Course dupliquee : {cid}'
              )

              ids.add(cid)

              status = course.get('statut')

              require(
                  isinstance(status, str)
                  and status in counts,
                  f'Statut inconnu : {cid}'
              )

              counts[status] += 1

              if status != 'OK':
                  reason = course.get('raison')

                  require(
                      isinstance(reason, str)
                      and bool(reason.strip()),
                      f'Motif absent : {cid}'
                  )
                  continue

              for key in (
                  'localisation_france_verifiee',
                  'depart_programme_verifie',
                  'partants_verifies',
              ):
                  require(
                      course.get(key) is True,
                      f'{cid} : {key} non verifie'
                  )

              require(
                  course.get(
                      'depart_effectif_verifie'
                  ) is False,
                  f'{cid} : depart effectif non prouve'
              )

              departure = aware_datetime(
                  course.get('depart'),
                  f'{cid} depart'
              )

              require(
                  departure.astimezone(
                      ZoneInfo('Europe/Paris')
                  ).date() == paris_date,
                  f'{cid} : date depart incoherente'
              )

              starters = course.get('partants')
              nonstarters = course.get('non_partants')
              total = course.get('nombre_partants')

              require(
                  isinstance(starters, list),
                  f'{cid} : partants invalides'
              )

              require(
                  isinstance(nonstarters, list),
                  f'{cid} : non-partants invalides'
              )

              require(
                  type(total) is int
                  and total > 0
                  and total == len(starters),
                  f'{cid} : nombre partants incoherent'
              )

              numbers = set()

              for horses, expected_np in (
                  (starters, False),
                  (nonstarters, True),
              ):
                  for horse in horses:
                      require(
                          isinstance(horse, dict),
                          f'{cid} : cheval invalide'
                      )

                      number = horse.get('numero')

                      require(
                          type(number) is int
                          and number > 0,
                          f'{cid} : numero invalide'
                      )

                      require(
                          number not in numbers,
                          f'{cid} : numero duplique'
                      )

                      numbers.add(number)

                      name = horse.get('nom')

                      require(
                          isinstance(name, str)
                          and bool(name.strip()),
                          f'{cid} : nom cheval absent'
                      )

                      require(
                          horse.get('non_partant')
                          is expected_np,
                          f'{cid} : statut cheval incoherent'
                      )

          correspondence = {
              'OK': 'courses_france_verifiees',
              'PARTIEL': 'courses_partielles',
              'REFUSE': 'courses_refusees',
          }

          for status, key in correspondence.items():
              require(
                  type(data.get(key)) is int
                  and data[key] == counts[status],
                  f'Compteur incoherent : {key}'
              )

          print('X1000 V2.5 : RAPPORT CONFORME')
          print('Courses controlees :', len(courses))
          print('France OK :', counts['OK'])
          print('Partielles :', counts['PARTIEL'])
          print('Refusees :', counts['REFUSE'])
          print('Publication : NON')
          print('FIGE : NON')
          print('M1-M5 : NON ALIMENTES')
          PY

      - name: Bilan GitHub
        if: success()
        shell: bash
        run: |
          {
            echo '## X1000 V2.5'
            echo ''
            echo '- Rapport technique : conforme au schema controle'
            echo '- Branche securisee : OK'
            echo '- Localisation et partants : controles selon rapport'
            echo '- Publication : aucune par ce workflow'
            echo '- FIGE : aucun par ce workflow'
            echo '- Transmission M1-M5 : aucune par ce workflow'
            echo '- Archives : non modifiees par ce workflow'
            echo ''
            echo 'Aucune validation sportive effectuee.'
            echo 'Le rapport ne prouve pas independamment la source PMU.'
          } >> "$GITHUB_STEP_SUMMARY"
