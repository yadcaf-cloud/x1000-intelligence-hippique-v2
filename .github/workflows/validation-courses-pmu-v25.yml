name: X1000 V2.5 - Validation courses PMU France

on:
  workflow_dispatch:

  push:
    branches:
      - feature/installation-x1000-v2
      - fix/x1000-v2-reparation-controlee

    paths:
      - "validation_courses_pmu_v25.py"
      - "courses.json"
      - "data/courses.json"
      - ".github/workflows/validation-courses-pmu-v25.yml"

permissions:
  contents: read

concurrency:
  group: x1000-v25-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    name: Validation France sans publication

    if: >-
      ${{
        github.ref == 'refs/heads/feature/installation-x1000-v2' ||
        github.ref == 'refs/heads/fix/x1000-v2-reparation-controlee'
      }}

    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONPATH: "."

    defaults:
      run:
        shell: bash

    steps:

      # ====================================================
      # 1. RECUPERATION SECURISEE
      # ====================================================

      - name: Recuperer branche securisee
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ====================================================
      # 2. VERIFICATION DE LA BRANCHE
      # ====================================================

      - name: Verifier branche autorisee
        run: |
          set -euo pipefail

          case "$GITHUB_REF" in
            refs/heads/feature/installation-x1000-v2)
              echo "Branche installation autorisee"
              ;;

            refs/heads/fix/x1000-v2-reparation-controlee)
              echo "Branche reparation autorisee"
              ;;

            *)
              echo "::error::Branche non autorisee"
              exit 1
              ;;
          esac

          echo "Reference : $GITHUB_REF"
          echo "Commit : $GITHUB_SHA"

          ACTUAL_SHA="$(git rev-parse HEAD)"

          if [ "$ACTUAL_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Commit incoherent"
            exit 1
          fi

          echo "Controle du commit : OK"

      # ====================================================
      # 3. VERIFICATION DE LA SYNTAXE PYTHON
      # ====================================================

      - name: Verifier syntaxe Python
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          from pathlib import Path

          name = "validation_courses_pmu_v25.py"
          path = Path(name)

          if not path.is_file():
              raise SystemExit(
                  "ERREUR : script de validation absent"
              )

          if not 0 < path.stat().st_size <= 5_000_000:
              raise SystemExit(
                  "ERREUR : taille du script invalide"
              )

          source = path.read_text(
              encoding="utf-8-sig"
          )

          ast.parse(
              source,
              filename=name
          )

          print("Syntaxe Python : OK")
          PY

      # ====================================================
      # 4. AUTOTESTS DU VALIDATEUR V2.5
      # ====================================================

      - name: Executer autotests V2.5
        run: |
          set -euo pipefail

          python validation_courses_pmu_v25.py \
            --self-test

          echo "Autotests V2.5 : OK"

      # ====================================================
      # 5. LOCALISATION DES DONNEES
      # ====================================================

      - name: Verifier disponibilite des donnees
        id: donnees
        run: |
          set -euo pipefail

          ROOT_FILE="courses.json"
          DATA_FILE="data/courses.json"

          if [ -f "$ROOT_FILE" ] &&
             [ -f "$DATA_FILE" ]; then

            echo "::error::Deux sources de courses presentes"
            echo "::error::Conserver une seule source"
            exit 1
          fi

          if [ -f "$ROOT_FILE" ]; then

            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "path=$ROOT_FILE" >> "$GITHUB_OUTPUT"

            echo "Source : $ROOT_FILE"

          elif [ -f "$DATA_FILE" ]; then

            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "path=$DATA_FILE" >> "$GITHUB_OUTPUT"

            echo "Source : $DATA_FILE"

          else

            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "path=" >> "$GITHUB_OUTPUT"

            echo "::notice::AUCUNE DONNEE"
            echo "Aucune course inventee"
            echo "Aucune validation de course effectuee"

          fi

      # ====================================================
      # 6. INTEGRITE DU JSON SOURCE
      # ====================================================

      - name: Verifier integrite du JSON source
        if: steps.donnees.outputs.present == 'true'

        env:
          COURSES_INPUT: ${{ steps.donnees.outputs.path }}

        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(
              os.environ["COURSES_INPUT"]
          )

          if not path.is_file():
              raise SystemExit(
                  "ERREUR : source absente"
              )

          if not 0 < path.stat().st_size <= 5_000_000:
              raise SystemExit(
                  "ERREUR : taille source invalide"
              )

          def unique_pairs(pairs):
              result = {}

              for key, value in pairs:
                  if key in result:
                      raise ValueError(
                          f"Cle JSON dupliquee : {key}"
                      )

                  result[key] = value

              return result

          def invalid_constant(value):
              raise ValueError(
                  f"Constante JSON interdite : {value}"
              )

          data = json.loads(
              path.read_text(
                  encoding="utf-8-sig"
              ),
              object_pairs_hook=unique_pairs,
              parse_constant=invalid_constant
          )

          if isinstance(data, list):
              courses = data

          elif (
              isinstance(data, dict)
              and isinstance(
                  data.get("courses"),
                  list
              )
          ):
              courses = data["courses"]

          else:
              raise SystemExit(
                  "ERREUR : liste de courses absente"
              )

          if not courses:
              raise SystemExit(
                  "ERREUR : aucune course fournie"
              )

          if len(courses) > 10_000:
              raise SystemExit(
                  "ERREUR : trop de courses"
              )

          print("JSON source : conforme")
          print("Fichier :", path)
          print("Nombre de courses :", len(courses))
          print("Aucune modification effectuee")
          PY

      # ====================================================
      # 7. VALIDATION STRUCTURELLE DES COURSES
      # ====================================================

      - name: Executer validation des courses
        if: steps.donnees.outputs.present == 'true'

        env:
          COURSES_INPUT: ${{ steps.donnees.outputs.path }}

        run: |
          set -euo pipefail

          REPORT="$RUNNER_TEMP/validation-v25.json"

          python validation_courses_pmu_v25.py \
            --input "$COURSES_INPUT" \
            --output "$REPORT"

          test -s "$REPORT"

          echo "Validation locale terminee"
          echo "Rapport conserve hors depot"
          echo "Aucune publication"

      # ====================================================
      # 8. CONTROLE STRICT DU RAPPORT
      # ====================================================

      - name: Controler rapport V2.5
        if: steps.donnees.outputs.present == 'true'

        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  raise ValueError(message)

          def unique_pairs(pairs):
              result = {}

              for key, value in pairs:
                  require(
                      key not in result,
                      f"Cle dupliquee : {key}"
                  )

                  result[key] = value

              return result

          def invalid_constant(value):
              raise ValueError(
                  f"Constante interdite : {value}"
              )

          report = (
              Path(os.environ["RUNNER_TEMP"])
              / "validation-v25.json"
          )

          require(
              report.is_file(),
              "Rapport absent"
          )

          require(
              0 < report.stat().st_size <= 2_000_000,
              "Taille rapport invalide"
          )

          data = json.loads(
              report.read_text(
                  encoding="utf-8-sig"
              ),
              object_pairs_hook=unique_pairs,
              parse_constant=invalid_constant
          )

          require(
              isinstance(data, dict),
              "Rapport non objet"
          )

          require(
              data.get("systeme") == "X1000 V2.5",
              "Systeme incorrect"
          )

          require(
              data.get("mode")
              == "VALIDATION_LOCALE_SANS_PUBLICATION",
              "Mode incorrect"
          )

          for key in (
              "validation_officielle",
              "collecte_automatique",
              "publication",
          ):
              require(
                  data.get(key) is False,
                  f"{key} doit etre false"
              )

          total = data.get("total")
          valides = data.get("valides")
          invalides = data.get("invalides")
          resultats = data.get("resultats")

          for key, value in (
              ("total", total),
              ("valides", valides),
              ("invalides", invalides),
          ):
              require(
                  type(value) is int
                  and value >= 0,
                  f"Compteur invalide : {key}"
              )

          require(
              isinstance(resultats, list),
              "Resultats invalides"
          )

          require(
              total == len(resultats),
              "Nombre de resultats incoherent"
          )

          require(
              valides + invalides == total,
              "Compteurs incoherents"
          )

          require(
              total > 0,
              "Aucune course dans le rapport"
          )

          require(
              invalides == 0,
              "Courses invalides detectees"
          )

          require(
              valides == total,
              "Validation incomplete"
          )

          require(
              data.get("statut") == "VALIDE",
              "Statut incorrect"
          )

          identifiers = set()

          for item in resultats:

              require(
                  isinstance(item, dict),
                  "Resultat non objet"
              )

              require(
                  item.get("valide") is True,
                  "Course invalide"
              )

              require(
                  item.get("erreurs") == [],
                  "Erreurs de validation presentes"
              )

              cid = item.get("id")

              require(
                  isinstance(cid, str)
                  and bool(cid.strip()),
                  "Identifiant absent"
              )

              require(
                  cid not in identifiers,
                  "Identifiant duplique"
              )

              identifiers.add(cid)

              require(
                  isinstance(
                      item.get("avertissements"),
                      list
                  ),
                  "Avertissements invalides"
              )

          print("X1000 V2.5 : RAPPORT CONFORME")
          print("Courses analysees :", total)
          print("Courses structurellement valides :", valides)
          print("Validation officielle : NON")
          print("Publication : NON")
          PY

      # ====================================================
      # 9. PROTECTION DU DEPOT ET DES ARCHIVES
      # ====================================================

      - name: Verifier absence de modifications
        if: always()

        run: |
          set -euo pipefail

          if ! git diff --quiet; then
            echo "::error::Fichiers suivis modifies"
            exit 1
          fi

          if ! git diff --cached --quiet; then
            echo "::error::Index Git modifie"
            exit 1
          fi

          if [ -n "$(
            git ls-files --others --exclude-standard
          )" ]; then

            echo "::error::Fichiers non suivis crees"
            exit 1
          fi

          echo "Depot inchange : OK"
          echo "Aucun FIGE modifie"
          echo "Aucune archive modifiee"

      # ====================================================
      # 10. BILAN GITHUB ACTIONS
      # ====================================================

      - name: Bilan GitHub
        if: success()

        env:
          DONNEES_PRESENTES: ${{ steps.donnees.outputs.present }}

        run: |
          set -euo pipefail

          {
            echo "## X1000 V2.5 - Validation PMU France"
            echo ""
            echo "- Branche securisee : OK"
            echo "- Syntaxe Python : OK"
            echo "- Autotests V2.5 : OK"
            echo "- Depot : inchange"
            echo "- Publication : aucune"
            echo "- FIGE automatique : aucun"
            echo "- Transmission M1-M5 : aucune"
            echo "- Archives : non modifiees"
            echo "- Commit automatique : aucun"
            echo ""

            if [ "$DONNEES_PRESENTES" = "true" ]; then

              echo "- Donnees fournies : OUI"
              echo "- Validation structurelle : CONFORME"

            else

              echo "- Donnees fournies : NON"
              echo "- Statut : AUCUNE DONNEE"
              echo "- Aucune course validee"

            fi

            echo ""
            echo "Validation officielle : NON"
            echo "Collecte automatique : NON"
            echo "Publication automatique : NON"

          } >> "$GITHUB_STEP_SUMMARY"
