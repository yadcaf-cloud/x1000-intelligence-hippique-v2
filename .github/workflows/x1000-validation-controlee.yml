name: X1000 - Validation controlee independante

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      X1000_READ_ONLY: "1"
      X1000_NO_FIGE: "1"
      X1000_NO_PUBLICATION: "1"

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verifier depot et branche
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = \
            'yadcaf-cloud/x1000-intelligence-hippique-v2'
          test "$GITHUB_REF_NAME" = \
            'fix/x1000-v2-reparation-controlee'

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer dependances
        run: |
          python -m pip install \
            'pytest>=8,<10' \
            'fastapi>=0.110,<1' \
            'httpx>=0.27,<1'

      - name: Verifier syntaxe essentielle
        run: |
          python -B - <<'PY'
          import ast
          from pathlib import Path

          files = [
              Path(f'moteurs/m{i}.py')
              for i in range(1, 6)
          ]

          files += [
              Path(p) for p in (
                  'moteurs/noyau_commun.py',
                  'api.py',
                  'coordination_x1000.py',
                  'integration_x1000.py',
                  'validation_moteurs.py',
                  'tests/test_fonctionnel_reel_m1_m5.py',
              )
          ]

          for p in files:
              if not p.is_file():
                  raise SystemExit(
                      f'FICHIER ESSENTIEL ABSENT: {p}'
                  )
              ast.parse(
                  p.read_text(encoding='utf-8-sig'),
                  filename=str(p)
              )
              print('SYNTAXE OK:', p)
          PY

      - name: Enregistrer empreintes initiales
        run: |
          python -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          names = {
              'figes.json',
              'audits.json',
              'courses.json',
              'selections.json'
          }
          excluded = {
              '.git', '.venv', 'venv',
              '__pycache__', '.pytest_cache'
          }
          hashes = {}

          for root, dirs, files in os.walk('.'):
              dirs[:] = [
                  d for d in dirs
                  if d not in excluded
                  and not (Path(root)/d).is_symlink()
              ]
              for name in files:
                  if name in names:
                      p = Path(root)/name
                      if p.is_symlink():
                          raise SystemExit(
                              f'SYMLINK INTERDIT: {p}'
                          )
                      hashes[p.as_posix()] = (
                          hashlib.sha256(
                              p.read_bytes()
                          ).hexdigest()
                      )

          output = (
              Path(os.environ['RUNNER_TEMP'])
              / 'x1000-hashes.json'
          )
          output.write_text(
              json.dumps(hashes, sort_keys=True)
          )
          print('Fichiers proteges:', len(hashes))
          PY

      - name: Tester M1-M5
        run: |
          python -B -m pytest \
            tests/test_fonctionnel_reel_m1_m5.py \
            -q -p no:cacheprovider

      - name: Verifier API lecture seule
        run: |
          python -B - <<'PY'
          from fastapi.testclient import TestClient
          from api import app

          with TestClient(app) as client:
              for route in (
                  'status',
                  'courses',
                  'selections',
                  'figes',
                  'audits',
                  'diagnostic'
              ):
                  r = client.get('/api/' + route)
                  assert r.status_code == 200, (
                      route, r.status_code, r.text
                  )
                  print('API OK:', route)

              for method in (
                  'POST', 'PUT', 'PATCH', 'DELETE'
              ):
                  r = client.request(
                      method,
                      '/api/figes',
                      json={}
                  )
                  assert r.status_code == 405
                  print('ECRITURE REFUSEE:', method)
          PY

      - name: Verifier integrite finale
        if: always()
        run: |
          python -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          snapshot = (
              Path(os.environ['RUNNER_TEMP'])
              / 'x1000-hashes.json'
          )
          if not snapshot.is_file():
              raise SystemExit(
                  'Empreintes initiales absentes'
              )

          before = json.loads(snapshot.read_text())
          names = {
              'figes.json',
              'audits.json',
              'courses.json',
              'selections.json'
          }
          excluded = {
              '.git', '.venv', 'venv',
              '__pycache__', '.pytest_cache'
          }
          after = {}

          for root, dirs, files in os.walk('.'):
              dirs[:] = [
                  d for d in dirs
                  if d not in excluded
                  and not (Path(root)/d).is_symlink()
              ]
              for name in files:
                  if name in names:
                      p = Path(root)/name
                      if p.is_symlink():
                          raise SystemExit(
                              f'SYMLINK INTERDIT: {p}'
                          )
                      after[p.as_posix()] = (
                          hashlib.sha256(
                              p.read_bytes()
                          ).hexdigest()
                      )

          if before != after:
              raise SystemExit(
                  'ERREUR: donnees protegees modifiees'
              )

          print('Donnees protegees inchangees')
          PY

          git diff --exit-code HEAD --
          git diff --cached --exit-code HEAD --
