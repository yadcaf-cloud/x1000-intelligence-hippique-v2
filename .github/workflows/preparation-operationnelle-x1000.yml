

#!/usr/bin/env bash
set -euo pipefail

BRANCHE="fix/x1000-v2-reparation-controlee"
WORKFLOW=".github/workflows/preparation-operationnelle-x1000.yml"
SOURCE=".github/workflows/dashboard_x1000.html"

echo "=== X1000 - REPARATION PAGES PUBLIQUES ==="

git rev-parse --show-toplevel >/dev/null
cd "$(git rev-parse --show-toplevel)"

if [[ "$(git branch --show-current)" != "$BRANCHE" ]]; then
  echo "ERREUR : branche incorrecte"
  exit 1
fi

if [[ -n "$(git status --porcelain)" ]]; then
  echo "ERREUR : modifications locales presentes"
  exit 1
fi

for fichier in "$WORKFLOW" "$SOURCE"; do
  if [[ ! -s "$fichier" ]]; then
    echo "ERREUR : fichier source absent : $fichier"
    exit 1
  fi
done

for fichier in index.html pmu.html dashboard_x1000.html; do
  if [[ -e "$fichier" ]]; then
    echo "ERREUR : fichier deja existant : $fichier"
    exit 1
  fi
done

# Publier une copie du tableau de bord existant.
# Le fichier source original reste intact.
cp "$SOURCE" dashboard_x1000.html

# Page d'accueil publique.
cat > index.html <<'HTML'
