name: X1000 V2.5 - Validation courses PMU France

on:
  workflow_dispatch:
  push:
    branches:
      - feature/installation-x1000-v2
      - fix/x1000-v2-reparation-controlee
    paths:
      - "validation_courses_pmu_v25.py"
      - "courses.json"
      - "data/courses.json"
      - ".github/workflows/validation-courses-pmu-v25.yml"

permissions:
  contents: read

concurrency:
  group: x1000-v25-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    name: Validation France sans publication

    if: >-
      ${{
        github.ref == 'refs/heads/feature/installation-x1000-v2' ||
        github.ref == 'refs/heads/fix/x1000-v2-reparation-controlee'
      }}

    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONPATH: "."

    steps:

      # ======================================================
      # 1. RECUPERATION SECURISEE
      # ======================================================

      - name: Recuperer branche securisee
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ======================================================
      # 2. CONTROLE DE LA BRANCHE
      # ======================================================

      - name: Verifier branche autorisee
        shell: bash
        run: |
          set -euo pipefail

          case "$GITHUB_REF" in
            refs/heads/feature/installation-x1000-v2)
              echo "Branche installation autorisee"
              ;;

            refs/heads/fix/x1000-v2-reparation-controlee)
              echo "Branche reparation autorisee"
              ;;

            *)
              echo "::error::Branche non autorisee"
              exit 1
              ;;
          esac

          echo "Reference : $GITHUB_REF"
          echo "Commit : $GITHUB_SHA"

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          echo "Branche securisee : OK"

      # ======================================================
      # 3. VERIFICATION DU SCRIPT PYTHON
      # ======================================================

      - name: Verifier syntaxe Python
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          from pathlib import Path

          name = "validation_courses_pmu_v25.py"
          path = Path(name)

          if not path.is_file():
              raise SystemExit(
                  "ERREUR : script de validation absent"
              )

          if path.stat().st_size == 0:
              raise SystemExit(
                  "ERREUR : script de validation vide"
              )

          ast.parse(
              path.read_text(encoding="utf-8-sig"),
              filename=name
          )

          print("Syntaxe Python : OK")
          PY

      # ======================================================
      # 4. AUTOTESTS V2.5
      # ======================================================

      - name: Executer autotests V2.5
        shell: bash
        run: |
          set -euo pipefail

          python validation_courses_pmu_v25.py \
            --self-test

          echo "Autotests V2.5 : OK"

      # ======================================================
      # 5. LOCALISATION DES DONNEES
      # ======================================================

      - name: Verifier disponibilite des donnees
        id: donnees
        shell: bash
        run: |
          set -euo pipefail

          if [ -f courses.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "path=courses.json" >> "$GITHUB_OUTPUT"
            echo "Donnees trouvees : courses.json"

          elif [ -f data/courses.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "path=data/courses.json" >> "$GITHUB_OUTPUT"
            echo "Donnees trouvees : data/courses.json"

          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "path=" >> "$GITHUB_OUTPUT"

            echo "::notice::AUCUNE DONNEE : courses.json absent"
            echo "Aucune course inventee"
          fi

      # ======================================================
      # 6. VERIFICATION DU JSON SOURCE
      # ======================================================

      - name: Verifier integrite des donnees source
        if: steps.donnees.outputs.present == 'true'
        shell: bash
        env:
          COURSES_INPUT: ${{ steps.donnees.outputs.path }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["COURSES_INPUT"])

          if not path.is_file():
              raise SystemExit(
                  "ERREUR : fichier source absent"
              )

          if not 0 < path.stat().st_size <= 5000000:
              raise SystemExit(
                  "ERREUR : taille source invalide"
              )

          def unique_pairs(pairs):
              result = {}

              for key, value in pairs:
                  if key in result:
                      raise ValueError(
                          f"Cle JSON dupliquee : {key}"
                      )

                  result[key] = value

              return result

          def invalid_constant(value):
              raise ValueError(
                  f"Constante JSON interdite : {value}"
              )

          data = json.loads(
              path.read_text(encoding="utf-8-sig"),
              object_pairs_hook=unique_pairs,
              parse_constant=invalid_constant
          )

          if not isinstance(data, (list, dict)):
              raise SystemExit(
                  "ERREUR : structure JSON incorrecte"
              )

          print("JSON source : conforme")
          print("Fichier :", path)
          print("Aucune modification effectuee")
          PY

      # ======================================================
      # 7. VALIDATION LOCALE DES COURSES
      # ======================================================

      - name: Executer validation des courses
        if: steps.donnees.outputs.present == 'true'
        shell: bash
        env:
          COURSES_INPUT: ${{ steps.donnees.outputs.path }}
        run: |
          set -euo pipefail

          python validation_courses_pmu_v25.py \
            --input "$COURSES_INPUT" \
            --output "$RUNNER_TEMP/validation-v25.json"

          echo "Rapport local genere hors depot"

      # ======================================================
      # 8. CONTROLE STRICT DU RAPPORT
      # ======================================================

      - name: Controler rapport V2.5
        if: steps.donnees.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  raise ValueError(message)

          def unique_pairs(pairs):
              result = {}

              for key, value in pairs:
                  require(
                      key not in result,
                      f"Cle JSON dupliquee : {key}"
                  )

                  result[key] = value

              return result

          def invalid_constant(value):
              raise ValueError(
                  f"Constante interdite : {value}"
              )

          report = (
              Path(os.environ["RUNNER_TEMP"])
              / "validation-v25.json"
          )

          require(
              report.is_file(),
              "Rapport absent"
          )

          require(
              0 < report.stat().st_size <= 2000000,
              "Taille rapport invalide"
          )

          data = json.loads(
              report.read_text(encoding="utf-8-sig"),
              object_pairs_hook=unique_pairs,
              parse_constant=invalid_constant
          )

          require(
              isinstance(data, dict),
              "Rapport non objet"
          )

          require(
              data.get("systeme") == "X1000 V2.5",
              "Systeme incorrect"
          )

          require(
              data.get("mode")
              == "VALIDATION_LOCALE_SANS_PUBLICATION",
              "Mode incorrect"
          )

          for key in (
              "validation_officielle",
              "collecte_automatique",
              "publication"
          ):
              require(
                  data.get(key) is False,
                  f"{key} doit etre false"
              )

          total = data.get("total")
          valid = data.get("valides")
          invalid = data.get("invalides")
          results = data.get("resultats")

          for key, value in (
              ("total", total),
              ("valides", valid),
              ("invalides", invalid)
          ):
              require(
                  type(value) is int and value >= 0,
                  f"Compteur invalide : {key}"
              )

          require(
              isinstance(results, list),
              "Resultats invalides"
          )

          require(
              total == len(results),
              "Nombre de resultats incoherent"
          )

          require(
              valid + invalid == total,
              "Compteurs incoherents"
          )

          require(
              total > 0,
              "Aucune course dans le rapport"
          )

          require(
              invalid == 0,
              "Courses invalides detectees"
          )

          require(
              data.get("statut") == "VALIDE",
              "Statut non valide"
          )

          for item in results:
              require(
                  isinstance(item, dict),
                  "Resultat non objet"
              )

              require(
                  item.get("valide") is True,
                  "Course invalide"
              )

              require(
                  item.get("erreurs") == [],
                  "Erreurs de validation presentes"
              )

          print("X1000 V2.5 : RAPPORT CONFORME")
          print("Courses analysees :", total)
          print("Courses structurellement valides :", valid)
          print("Validation officielle : NON")
          print("Publication : NON")
          PY

      # ======================================================
      # 9. PROTECTION DES FICHIERS HISTORIQUES
      # ======================================================

      - name: Verifier absence de modifications
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet ||
             ! git diff --cached --quiet; then
            echo "::error::Fichiers suivis modifies"
            exit 1
          fi

          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Fichiers non suivis crees"
            exit 1
          fi

          echo "Depot inchange : OK"
          echo "Archives et FIGES : aucune modification detectee"

      # ======================================================
      # 10. BILAN GITHUB
      # ======================================================

      - name: Bilan GitHub
        if: success()
        shell: bash
        env:
          DONNEES_PRESENTES: ${{ steps.donnees.outputs.present }}
        run: |
          set -euo pipefail

          {
            echo "## X1000 V2.5 - Validation PMU France"
            echo ""
            echo "- Branche securisee : OK"
            echo "- Syntaxe Python : OK"
            echo "- Autotests Python : reussis"
            echo "- Depot : inchange"
            echo "- Publication : aucune"
            echo "- FIGE : aucun par le workflow"
            echo "- Transmission M1-M5 : aucune"
            echo "- Archives : non modifiees"
            echo "- Commit automatique : aucun"
            echo ""

            if [ "$DONNEES_PRESENTES" = "true" ]; then
              echo "- Validation structurelle : conforme"
              echo "- Donnees fournies : oui"
            else
              echo "- Statut : AUCUNE DONNEE"
              echo "- courses.json absent"
              echo "- Aucune course validee"
            fi

            echo ""
            echo "Validation officielle : NON"
            echo "Collecte automatique : NON"
            echo "Publication automatique : NON"
          } >> "$GITHUB_STEP_SUMMARY"
