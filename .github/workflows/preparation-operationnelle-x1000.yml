name: X1000 - Preparation operationnelle

"on":
  workflow_dispatch:

  push:
    branches:
      - fix/x1000-v2-reparation-controlee
    paths:
      - "moteurs/**"
      - "coordination_x1000.py"
      - "integration_x1000.py"
      - "validation_moteurs.py"
      - "api.py"
      - "tests/**"
      - ".github/workflows/preparation-operationnelle-x1000.yml"

  pull_request:
    paths:
      - "moteurs/**"
      - "coordination_x1000.py"
      - "integration_x1000.py"
      - "validation_moteurs.py"
      - "api.py"
      - "tests/**"
      - ".github/workflows/preparation-operationnelle-x1000.yml"

permissions:
  contents: read

concurrency:
  group: x1000-preparation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preparation:
    name: Controle operationnel M1-M5
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      X1000_DATA_DIR: ${{ github.workspace }}/.x1000-test-data

    defaults:
      run:
        shell: bash

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer dependances
        run: |
          set -euo pipefail
          python -m pip install \
            "fastapi>=0.110,<1" \
            "httpx>=0.27,<1" \
            "pytest>=8,<10"

      - name: Preparer environnement isole
        run: |
          set -euo pipefail
          mkdir -p "$X1000_DATA_DIR"
          echo "Environnement de test : OK"

      - name: Verifier fichiers essentiels
        run: |
          set -euo pipefail

          fichiers=(
            api.py
            coordination_x1000.py
            integration_x1000.py
            validation_moteurs.py
            moteurs/noyau_commun.py
            moteurs/m1.py
            moteurs/m2.py
            moteurs/m3.py
            moteurs/m4.py
            moteurs/m5.py
            tests/test_regression_x1000_m1_m5.py
            tests/test_securite_integration_x1000.py
            tests/test_coordination_centrale_x1000.py
            tests/test_coordination_renforcee_x1000.py
            tests/test_preparation_exploitation_x1000.py
            tests/test_fonctionnel_moteurs_x1000.py
            tests/test_fonctionnel_reel_m1_m5.py
            tests/test_fonctionnel_x1000.py
          )

          for fichier in "${fichiers[@]}"; do
            if [[ ! -s "$fichier" ]]; then
              echo "::error::Fichier absent : $fichier"
              exit 1
            fi
            echo "OK : $fichier"
          done

      - name: Controler syntaxe Python
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          fichiers = [
              Path("api.py"),
              Path("coordination_x1000.py"),
              Path("integration_x1000.py"),
              Path("validation_moteurs.py"),
          ]

          fichiers += sorted(
              Path("moteurs").glob("*.py")
          )

          fichiers += sorted(
              Path("tests").glob("test_*.py")
          )

          for fichier in fichiers:
              source = fichier.read_text(
                  encoding="utf-8-sig"
              )
              ast.parse(
                  source,
                  filename=str(fichier)
              )
              print("SYNTAXE OK:", fichier)

          print("Syntaxe Python : OK")
          PY

      - name: Tester moteurs M1-M5
        run: |
          python - <<'PY'
          import importlib

          for numero in range(1, 6):
              nom = f"M{numero}"
              module = importlib.import_module(
                  f"moteurs.m{numero}"
              )

              assert module.MOTEUR == nom
              assert module.POIDS
              assert module.CHAMP

              print("MOTEUR OK:", nom)

          print("M1-M5 : controles termines")
          PY

      - name: Controler coordination centrale
        run: |
          python - <<'PY'
          import importlib

          modules = (
              "validation_moteurs",
              "coordination_x1000",
              "integration_x1000",
          )

          for nom in modules:
              importlib.import_module(nom)
              print("MODULE OK:", nom)

          print("Coordination centrale : OK")
          PY

      - name: Controler six routes API
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from api import app

          routes = (
              "status",
              "courses",
              "selections",
              "figes",
              "audits",
              "diagnostic",
          )

          with TestClient(app) as client:
              for nom in routes:
                  reponse = client.get(
                      f"/api/{nom}"
                  )

                  assert reponse.status_code == 200, (
                      nom,
                      reponse.status_code,
                  )

                  assert isinstance(
                      reponse.json(), dict
                  )

                  print("API OK:", nom)

              status = client.get(
                  "/api/status"
              ).json()

              assert (
                  status["mode"]
                  == "LECTURE_SEULE_WEB"
              )

              for numero in range(1, 6):
                  assert (
                      f"M{numero}"
                      in status["moteurs"]
                  )

              assert (
                  status["figes_automatiques"]
                  is False
              )

              assert (
                  status["publication_automatique"]
                  is False
              )

              assert (
                  status["collecte_automatique"]
                  is False
              )

              for methode in (
                  "post",
                  "put",
                  "patch",
                  "delete",
              ):
                  reponse = getattr(
                      client, methode
                  )(
                      "/api/figes",
                      json={}
                  )

                  assert (
                      reponse.status_code == 405
                  ), methode

          print("Six routes API : OK")
          print("Lecture seule : OK")
          PY

      # ==========================================
      # CONTROLE DES PAGES OFFICIELLES
      # ==========================================

      - name: Recuperer pages officielles X1000
        uses: actions/checkout@v4
        with:
          ref: main
          path: x1000-pages-reference
          persist-credentials: false
          sparse-checkout: |
            index.html
            pmu.html
          sparse-checkout-cone-mode: false

      - name: Verifier pages et liens GitHub Pages
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit, unquote

          racine = Path(
              "x1000-pages-reference"
          ).resolve()

          pages = (
              "index.html",
              "pmu.html",
          )

          class AnalyseLiens(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.liens = []

              def handle_starttag(self, tag, attrs):
                  attributs = dict(attrs)

                  if tag == "a":
                      lien = attributs.get("href")

                      if lien is not None:
                          self.liens.append(lien)

          for nom in pages:
              fichier = racine / nom

              if (
                  not fichier.is_file()
                  or fichier.is_symlink()
              ):
                  raise SystemExit(
                      f"Page officielle absente : {nom}"
                  )

              contenu = fichier.read_text(
                  encoding="utf-8-sig"
              )

              if not contenu.strip():
                  raise SystemExit(
                      f"Page officielle vide : {nom}"
                  )

              analyse = AnalyseLiens()
              analyse.feed(contenu)

              for lien in analyse.liens:
                  url = urlsplit(lien.strip())

                  if url.scheme or url.netloc:
                      continue

                  if (
                      not url.path
                      or url.path.startswith("/")
                  ):
                      continue

                  cible = (
                      fichier.parent
                      / unquote(url.path)
                  ).resolve()

                  if not cible.is_relative_to(racine):
                      raise SystemExit(
                          f"Lien hors site : {lien}"
                      )

                  if (
                      cible.suffix.lower() == ".html"
                      and not cible.is_file()
                  ):
                      raise SystemExit(
                          f"Lien HTML invalide : {lien}"
                      )

              print("PAGE OK:", nom)

          print(
              "Pages officielles et liens HTML : OK"
          )
          PY

      # ==========================================
      # TESTS EXISTANTS CONSERVES
      # ==========================================

      - name: Executer tests de regression
        run: |
          python -m pytest \
            tests/test_regression_x1000_m1_m5.py \
            -v

      - name: Executer tests de securite
        run: |
          python -m pytest \
            tests/test_securite_integration_x1000.py \
            -v

      - name: Executer tests de coordination
        run: |
          python -m pytest \
            tests/test_coordination_centrale_x1000.py \
            tests/test_coordination_renforcee_x1000.py \
            -v

      - name: Executer tests de preparation
        run: |
          python -m pytest \
            tests/test_preparation_exploitation_x1000.py \
            -v

      - name: Executer tests fonctionnels
        run: |
          python -m pytest \
            tests/test_fonctionnel_moteurs_x1000.py \
            tests/test_fonctionnel_reel_m1_m5.py \
            tests/test_fonctionnel_x1000.py \
            -v

      - name: Verifier integrite du depot
        if: always()
        run: |
          set -euo pipefail

          echo "Controle des fichiers suivis"

          git diff --exit-code
          git diff --cached --exit-code

          echo "Fichiers suivis inchanges : OK"

      - name: Bilan preparation X1000
        if: success()
        run: |
          echo "================================"
          echo "X1000 - PREPARATION TERMINEE"
          echo "M1-M5 : controles reussis"
          echo "Coordination : controlee"
          echo "Six routes API : controlees"
          echo "Pages officielles : controlees"
          echo "Regression : tests reussis"
          echo "Securite : tests reussis"
          echo "FIGES : aucune ecriture demandee"
          echo "Archives : aucune ecriture demandee"
          echo "================================"
