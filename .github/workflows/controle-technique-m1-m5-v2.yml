name: X1000 PHOENIX V2.4 - Controle technique M1-M5

on:
  workflow_dispatch:

  push:
    branches:
      - fix/x1000-v2-reparation-controlee
    paths:
      - "moteurs/**"
      - "tests/**"
      - "coordination_x1000.py"
      - "integration_x1000.py"
      - "validation_moteurs.py"
      - "api.py"
      - ".github/workflows/controle-technique-m1-m5-v2.yml"

permissions:
  contents: read

concurrency:
  group: x1000-controle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  controle-technique:
    name: Verification securisee X1000
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      X1000_READ_ONLY: "1"
      X1000_NO_FIGE: "1"
      X1000_NO_PUBLICATION: "1"

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: |
          set -euo pipefail
          python -m pip install \
            "fastapi>=0.115,<1" \
            "httpx>=0.27,<1" \
            "pytest>=8,<10"

      - name: Isoler les donnees
        run: |
          set -euo pipefail
          DATA_DIR="$RUNNER_TEMP/x1000-data"
          mkdir -p "$DATA_DIR"
          echo "X1000_DATA_DIR=$DATA_DIR" >> "$GITHUB_ENV"

      - name: Verifier la syntaxe Python
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import ast
          from pathlib import Path

          fichiers = set()

          for dossier in ("moteurs", "tests"):
              if Path(dossier).is_dir():
                  fichiers.update(
                      Path(dossier).rglob("*.py")
                  )

          for nom in (
              "coordination_x1000.py",
              "integration_x1000.py",
              "validation_moteurs.py",
              "api.py",
          ):
              if Path(nom).is_file():
                  fichiers.add(Path(nom))

          if not fichiers:
              raise RuntimeError(
                  "Aucun fichier Python trouve"
              )

          for fichier in sorted(fichiers):
              ast.parse(
                  fichier.read_text(
                      encoding="utf-8-sig"
                  ),
                  filename=str(fichier),
              )
              print(f"OK : {fichier}")

          print("Syntaxe Python validee")
          PY

      - name: Verifier les moteurs M1-M5
        run: |
          set -euo pipefail
          python -B - <<'PY'
          from pathlib import Path

          for i in range(1, 6):
              fichier = Path(f"moteurs/m{i}.py")
              if not fichier.is_file():
                  raise RuntimeError(
                      f"Moteur M{i} introuvable"
                  )
              print(f"M{i} : fichier present")

          print("M1-M5 : presence validee")
          PY

      - name: Executer les autotests M1-M5
        run: |
          set -euo pipefail

          for moteur in m1 m2 m3 m4 m5; do
            echo "=== AUTOTEST $moteur ==="
            python -B -m "moteurs.$moteur" --self-test
          done

      - name: Verifier les interfaces
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import importlib

          for i in range(1, 6):
              nom = f"M{i}"
              module = importlib.import_module(
                  f"moteurs.m{i}"
              )

              assert getattr(module, "MOTEUR", None) == nom

              for fonction in (
                  "verifier_noyau",
                  "analyser_course",
                  "self_test",
              ):
                  assert callable(
                      getattr(module, fonction, None)
                  ), f"{nom}: {fonction} absente"

              print(f"{nom} : interface validee")
          PY

      - name: Verifier la coordination
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import integration_x1000 as integration
          import coordination_x1000 as coordination

          assert callable(
              getattr(integration, "coordonner", None)
          )
          assert callable(
              getattr(coordination, "coordonner", None)
          )

          print("Coordination : interfaces presentes")
          PY

      - name: Executer les tests de regression
        run: |
          set -euo pipefail

          if [[ ! -d tests ]]; then
            echo "ERREUR : dossier tests absent"
            exit 1
          fi

          if ! find tests -type f \
            -name 'test_*.py' | grep -q .; then
            echo "ERREUR : aucun test disponible"
            exit 1
          fi

          python -B -m pytest \
            tests \
            -v \
            --tb=short \
            -p no:cacheprovider

      - name: Tester les routes API
        run: |
          set -euo pipefail
          python -B - <<'PY'
          from fastapi.testclient import TestClient
          from api import app

          routes = (
              "/api/status",
              "/api/courses",
              "/api/selections",
              "/api/figes",
              "/api/audits",
              "/api/diagnostic",
          )

          with TestClient(app) as client:
              for route in routes:
                  response = client.get(route)
                  assert response.status_code == 200, (
                      route,
                      response.status_code,
                  )
                  print(f"GET {route} : OK")
          PY

      - name: Verifier integrite du depot
        if: always()
        run: |
          set -euo pipefail

          git diff --exit-code HEAD --
          git diff --cached --exit-code HEAD --

          echo "Fichiers suivis inchanges"
          echo "Fichiers non suivis :"
          git ls-files --others --exclude-standard

      - name: Rapport technique
        if: always()
        env:
          RESULTAT: ${{ job.status }}
        run: |
          {
            echo "## X1000 PHOENIX V2.4"
            echo ""
            echo "Resultat : $RESULTAT"
            echo ""
            echo "### Controles"
            echo "- Syntaxe Python"
            echo "- Moteurs M1-M5"
            echo "- Autotests"
            echo "- Interfaces"
            echo "- Coordination"
            echo "- Regression"
            echo "- API"
            echo "- Integrite du depot"
            echo ""
            echo "### Securite"
            echo "- Aucun commit automatique"
            echo "- Aucun push automatique"
            echo "- Aucun deploiement"
            echo "- Aucun FIGE automatique"
          } >> "$GITHUB_STEP_SUMMARY"
