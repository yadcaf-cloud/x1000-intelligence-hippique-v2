      - name: Tester absence de predictions inventees
        working-directory: ${{ steps.sandbox.outputs.workdir }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import copy
          import importlib
          from datetime import datetime, timedelta, timezone

          from moteurs import noyau_commun as noyau

          depart = (
              datetime.now(timezone.utc)
              + timedelta(days=1)
          ).isoformat()

          course = {
              "id": "TEST-MOTEURS-SANS-DONNEES",
              "localisation_france_verifiee": True,
              "depart_verifie": True,
              "depart": depart,
              "nombre_partants": 5,
              "non_partants": [],
              "partants": [
                  {
                      "numero": i,
                      "nom": f"Cheval test {i}",
                      "non_partant": False,
                  }
                  for i in range(1, 6)
              ],
          }

          valide, raison = noyau.verifier_course(course)
          assert valide, raison

          for i in range(1, 6):
              nom = f"M{i}"
              module = importlib.import_module(
                  f"moteurs.m{i}"
              )

              assert module.MOTEUR == nom

              entree = copy.deepcopy(course)
              resultat = module.analyser_course(entree)

              assert entree == course, (
                  f"{nom}: course modifiee"
              )
              assert isinstance(resultat, dict)
              assert resultat.get("moteur") == nom

              # CORRECTION : resultat en premier.
              valide_resultat = (
                  noyau.verifier_sortie_analyse(
                      resultat=resultat,
                      course=course,
                  )
              )

              assert valide_resultat == resultat

              assert resultat.get("statut") == (
                  "DONNEES_INSUFFISANTES"
              ), f"{nom}: statut incorrect"

              assert resultat.get("classement") == [], (
                  f"{nom}: classement invente"
              )
              assert resultat.get(
                  "classement_partiel"
              ) == [], (
                  f"{nom}: classement partiel invente"
              )

              assert resultat.get("fige") is False
              assert resultat.get("publication") is False

              assert resultat.get("course_id") == (
                  course["id"]
              )

              # Test negatif : moteur sans identite.
              invalide = copy.deepcopy(resultat)
              invalide.pop("moteur", None)

              try:
                  noyau.verifier_sortie_analyse(
                      resultat=invalide,
                      course=course,
                  )
              except ValueError as exc:
                  assert "Identite moteur invalide" in str(exc)
              else:
                  raise AssertionError(
                      f"{nom}: identite absente acceptee"
                  )

              # Test negatif : FIGE interdit.
              invalide = copy.deepcopy(resultat)
              invalide["fige"] = True

              try:
                  noyau.verifier_sortie_analyse(
                      resultat=invalide,
                      course=course,
                  )
              except ValueError as exc:
                  assert "FIGE interdit" in str(exc)
              else:
                  raise AssertionError(
                      f"{nom}: FIGE non rejete"
                  )

              # Test negatif : publication interdite.
              invalide = copy.deepcopy(resultat)
              invalide["publication"] = True

              try:
                  noyau.verifier_sortie_analyse(
                      resultat=invalide,
                      course=course,
                  )
              except ValueError as exc:
                  assert "Publication interdite" in str(exc)
              else:
                  raise AssertionError(
                      f"{nom}: publication non rejetee"
                  )

              print(
                  f"{nom}: validation et securite OK"
              )

          print("CONTROLE M1-M5 TERMINE")
          PY
