# Verifier les trois pages.
python - <<'PY'
from pathlib import Path
from html.parser import HTMLParser
from urllib.parse import urlsplit, unquote

root = Path(".").resolve()

class Analyse(HTMLParser):
    def __init__(self):
        super().__init__()
        self.tags = set()
        self.refs = []

    def handle_starttag(self, tag, attrs):
        self.tags.add(tag)
        for key, value in attrs:
            if key in ("href", "src") and value:
                self.refs.append(value)

for nom in (
    "index.html",
    "pmu.html",
    "dashboard_x1000.html",
):
    fichier = root / nom
    contenu = fichier.read_text(encoding="utf-8-sig")
    parser = Analyse()
    parser.feed(contenu)
    parser.close()

    assert {"html", "head", "body"} <= parser.tags
    assert contenu.strip().lower().endswith("</html>")

    for ref in parser.refs:
        url = urlsplit(ref)
        if url.scheme or url.netloc or not url.path:
            continue

        chemin = unquote(url.path)
        cible = (
            root / chemin.lstrip("/")
            if chemin.startswith("/")
            else fichier.parent / chemin
        ).resolve()

        assert cible.is_relative_to(root), ref

        if cible.is_dir():
            cible = cible / "index.html"

        assert cible.is_file(), (
            f"Lien absent dans {nom}: {ref}"
        )

    print("PAGE OK:", nom)

print("Pages et liens locaux : OK")
PY

