name: X1000 V2.4 - Validation securisee M1-M5

on:
  workflow_dispatch:
  push:
    branches:
      - feature/installation-x1000-v2
      - fix/x1000-v2-reparation-controlee
    paths:
      - "M*.py"
      - "m*.py"
      - "moteurs/**"
      - "tests/**"
      - "test_*.py"
      - "api.py"
      - "validation_moteurs.py"
      - "coordination_x1000.py"
      - "config_x1000.py"
      - ".github/workflows/validation-moteurs.yml"

permissions:
  contents: read

concurrency:
  group: x1000-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    name: Controle M1-M5 sans publication
    if: >-
      ${{
        github.ref == 'refs/heads/feature/installation-x1000-v2' ||
        github.ref == 'refs/heads/fix/x1000-v2-reparation-controlee'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONPATH: "."

    steps:
      - name: Recuperer branche securisee
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verifier branche
        shell: bash
        run: |
          set -euo pipefail

          case "$GITHUB_REF" in
            refs/heads/feature/installation-x1000-v2|refs/heads/fix/x1000-v2-reparation-controlee)
              echo "Reference autorisee : $GITHUB_REF"
              ;;
            *)
              echo "::error::Branche non autorisee"
              exit 1
              ;;
          esac

          BRANCH="${GITHUB_REF#refs/heads/}"

          test "$(git branch --show-current)" = "$BRANCH"

          echo "Branche securisee : OK"

      - name: Verifier syntaxe Python
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          from pathlib import Path

          excluded = {
              ".git",
              ".venv",
              "venv",
              "__pycache__",
              "node_modules",
              "site-packages"
          }

          files = sorted(
              p for p in Path(".").rglob("*.py")
              if not any(
                  part in excluded
                  or part.startswith(".")
                  for part in p.parts
              )
          )

          if not files:
              raise SystemExit(
                  "ERREUR : aucun fichier Python"
              )

          for path in files:
              ast.parse(
                  path.read_text(encoding="utf-8-sig"),
                  filename=str(path)
              )
              print("SYNTAXE OK :", path)

          print("Fichiers controles :", len(files))
          PY

      - name: Verifier cinq moteurs independants
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          root = Path(".")
          folder = Path("moteurs")
          found = []

          for number in range(1, 6):
              names = (
                  f"m{number}.py",
                  f"M{number}.py"
              )

              candidates = [
                  base / name
                  for base in (folder, root)
                  for name in names
                  if (base / name).is_file()
              ]

              if not candidates:
                  raise SystemExit(
                      f"ERREUR : moteur M{number} absent"
                  )

              for path in candidates:
                  if path.stat().st_size == 0:
                      raise SystemExit(
                          f"ERREUR : moteur vide {path}"
                      )

              chosen = candidates[0]
              found.append(chosen)

              print(
                  f"M{number} : PRESENT - {chosen}"
              )

              if len(candidates) > 1:
                  print(
                      f"AVERTISSEMENT M{number} : "
                      "plusieurs fichiers detectes"
                  )

          if len(found) != 5:
              raise SystemExit(
                  "ERREUR : cinq moteurs requis"
              )

          print("M1-M5 : PRESENCE CONFIRMEE")
          print(
              "Independance fonctionnelle "
              "non prouvee par ce controle"
          )
          PY

      - name: Verifier composants centraux
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          required = (
              "api.py",
              "validation_moteurs.py",
              "coordination_x1000.py",
              "config_x1000.py"
          )

          for name in required:
              path = Path(name)

              if not path.is_file():
                  raise SystemExit(
                      f"ERREUR : fichier absent {name}"
                  )

              if path.stat().st_size == 0:
                  raise SystemExit(
                      f"ERREUR : fichier vide {name}"
                  )

              print("COMPOSANT OK :", name)
          PY

      - name: Tester chargement API M1-M5
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import api
          import importlib

          names = ("M1", "M2", "M3", "M4", "M5")

          for name in names:
              if not api.engine_available(name):
                  raise SystemExit(
                      f"ERREUR : {name} absent dans API"
                  )

              if name == "M1":
                  module = importlib.import_module(
                      "moteurs.m1"
                  )
              else:
                  path = api.engine_path(name)
                  import importlib.util

                  spec = importlib.util.spec_from_file_location(
                      "test_" + name.lower(),
                      path
                  )

                  if spec is None or spec.loader is None:
                      raise SystemExit(
                          f"ERREUR : chargement {name}"
                      )

                  module = importlib.util.module_from_spec(
                      spec
                  )
                  spec.loader.exec_module(module)

              if not callable(
                  getattr(module, "analyser_course", None)
              ):
                  raise SystemExit(
                      f"ERREUR : analyser_course {name}"
                  )

              print(f"IMPORT {name} : OK")

          print("Chargement API M1-M5 : OK")
          PY

      - name: Executer tests Python
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import sys
          import unittest
          from pathlib import Path

          loader = unittest.TestLoader()
          suite = unittest.TestSuite()

          for path in sorted(
              Path(".").glob("test_*.py")
          ):
              suite.addTests(
                  loader.loadTestsFromName(path.stem)
              )

          folder = Path("tests")

          if folder.is_dir():
              suite.addTests(
                  loader.discover(
                      start_dir=str(folder),
                      pattern="test_*.py",
                      top_level_dir=str(folder)
                  )
              )

          count = suite.countTestCases()

          if count == 0:
              raise SystemExit(
                  "ERREUR : aucun test decouvert"
              )

          print("Tests decouverts :", count)

          result = unittest.TextTestRunner(
              verbosity=2
          ).run(suite)

          if not result.wasSuccessful():
              sys.exit(1)

          print("Tests Python : REUSSIS")
          PY

      - name: Verifier API lecture seule
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import api

          required = (
              "/api/status",
              "/api/courses",
              "/api/selections",
              "/api/figes",
              "/api/audits",
              "/api/diagnostic"
          )

          for route in required:
              if route not in api.ROUTES:
                  raise SystemExit(
                      f"ERREUR : route absente {route}"
                  )

          for method in (
              "do_POST",
              "do_PUT",
              "do_PATCH",
              "do_DELETE"
          ):
              if not hasattr(api.Handler, method):
                  raise SystemExit(
                      f"ERREUR : protection absente {method}"
                  )

          print("API lecture seule : controles OK")
          PY

      - name: Verifier depot inchange
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "Verification du depot"

          if ! git diff --quiet ||
             ! git diff --cached --quiet; then
            echo "::error::Fichiers suivis modifies"
            exit 1
          fi

          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Fichiers non suivis crees"
            exit 1
          fi

          echo "Depot inchange : OK"

      - name: Bilan de validation
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## X1000 V2.4 - Validation M1-M5"
            echo ""
            echo "- Branche securisee : OK"
            echo "- Syntaxe Python : OK"
            echo "- Cinq moteurs : presents"
            echo "- Chargement API M1-M5 : OK"
            echo "- Composants centraux : presents"
            echo "- Tests Python : reussis"
            echo "- Routes API : controlees"
            echo "- Depot : inchange"
            echo "- Publication : aucune"
            echo "- FIGE : aucun par le workflow"
            echo "- Commit automatique : aucun"
            echo ""
            echo "Aucune prediction publiee."
            echo "Execution sportive complete non certifiee."
          } >> "$GITHUB_STEP_SUMMARY"
