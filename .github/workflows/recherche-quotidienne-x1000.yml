name: X1000 - Recherche quotidienne M1-M5

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

concurrency:
  group: x1000-recherche-quotidienne
  cancel-in-progress: false

jobs:
  recherche:
    if: github.repository == 'yadcaf-cloud/x1000-intelligence-hippique-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      X1000_READ_ONLY: "1"
      X1000_NO_FIGE: "1"
      X1000_NO_PUBLICATION: "1"
      X1000_SOURCE_URL: ${{ vars.X1000_SOURCE_URL }}
      X1000_SOURCE_HOST: ${{ vars.X1000_SOURCE_HOST }}

    steps:
      - name: Recuperer la branche autorisee
        uses: actions/checkout@v4
        with:
          ref: fix/x1000-v2-reparation-controlee
          persist-credentials: false

      - name: Verifier depot et commit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = \
            "yadcaf-cloud/x1000-intelligence-hippique-v2"

          git fetch --no-tags origin \
            '+refs/heads/fix/x1000-v2-reparation-controlee:refs/remotes/origin/fix/x1000-v2-reparation-controlee'

          test "$(git rev-parse HEAD)" = \
            "$(git rev-parse refs/remotes/origin/fix/x1000-v2-reparation-controlee)"

          test -n "$X1000_SOURCE_URL"
          test -n "$X1000_SOURCE_HOST"

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verifier M1 a M5 et coordination
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import ast
          from pathlib import Path

          noms = [
              "recherche_courses_x1000.py",
              "x1000_sources_officielles.py",
              "integration_x1000.py",
              "coordination_x1000.py",
              "validation_moteurs.py",
          ]
          noms += [
              f"moteurs/m{i}.py"
              for i in range(1, 6)
          ]

          for nom in noms:
              fichier = Path(nom)
              ast.parse(
                  fichier.read_text(encoding="utf-8"),
                  filename=nom
              )
              print("OK :", nom)

          from moteurs import m1, m2, m3, m4, m5
          from integration_x1000 import executer_integration
          print("M1-M5 : IMPORTS OK")
          PY

      - name: Verifier les sources officielles
        shell: bash
        run: |
          set -euo pipefail
          python -B x1000_sources_officielles.py --self-test
          python -B x1000_sources_officielles.py

      - name: Recherche et analyses M1-M5
        shell: bash
        run: |
          set -euo pipefail
          python -B recherche_courses_x1000.py

      - name: Controler aucune modification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code

          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Fichiers non suivis detectes"
            git ls-files --others --exclude-standard
            exit 1
          fi

      - name: Bilan de securite
        if: always()
        shell: bash
        run: |
          {
            echo "## X1000 PHOENIX"
            echo "- Analyses M1-M5 : voir logs"
            echo "- Lecture seule : active"
            echo "- FIGE automatique : interdit"
            echo "- Publication : interdite"
            echo "- Aucun deploiement"
            echo "- Aucune modification autorisee"
          } >> "$GITHUB_STEP_SUMMARY"
