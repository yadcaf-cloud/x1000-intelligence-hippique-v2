name: X1000 - Validation autonomie M1-M5

on:
  workflow_dispatch:

  push:
    branches:
      - fix/x1000-v2-reparation-controlee
    paths:
      - "moteurs/**"
      - "integration_x1000.py"
      - "coordination_x1000.py"
      - "validation_moteurs.py"
      - "api.py"
      - "tests/**"
      - ".github/workflows/validation-autonomie-x1000.yml"

permissions:
  contents: read

jobs:
  validation-autonomie:
    name: Controle autonomie X1000
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances API
        run: |
          set -eu
          python -m pip install --upgrade pip
          python -m pip install \
            "fastapi>=0.110,<1" \
            "httpx>=0.27,<1"

      - name: Verifier les composants
        run: |
          set -eu

          test -f integration_x1000.py
          test -f coordination_x1000.py
          test -f validation_moteurs.py
          test -f moteurs/noyau_commun.py
          test -f api.py

          for n in 1 2 3 4 5; do
            test -f "moteurs/m${n}.py"
          done

      - name: Verifier les dependances API
        run: |
          python -c "import fastapi, httpx; print('Dependances API disponibles')"

      - name: Verifier la syntaxe Python
        run: |
          python -m compileall -q \
            moteurs \
            integration_x1000.py \
            coordination_x1000.py \
            validation_moteurs.py \
            api.py \
            tests

      - name: Executer les tests fonctionnels
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_*.py" \
            -v

      - name: Confirmation
        run: |
          echo "Tests X1000 termines avec succes"
          echo "Moteurs M1-M5 controles"
          echo "Dependances API disponibles"
          echo "Aucune collecte PMU par le workflow"
          echo "Aucun FIGE cree par le workflow"
          echo "Aucune publication par le workflow"
          echo "Aucune modification des archives par le workflow"
