#!/usr/bin/env bash
set -euo pipefail

DEPOT="https://github.com/yadcaf-cloud/x1000-intelligence-hippique-v2.git"
BRANCHE="fix/x1000-v2-reparation-controlee"
WORKFLOW=".github/workflows/preparation-operationnelle-x1000.yml"
SOURCE=".github/workflows/dashboard_x1000.html"

echo "=== X1000 - REPARATION CONTROLEE ==="

# Verifier le depot local.
git rev-parse --is-inside-work-tree >/dev/null
cd "$(git rev-parse --show-toplevel)"

ORIGIN="$(git remote get-url origin)"

case "$ORIGIN" in
  "$DEPOT"|\
  "https://github.com/yadcaf-cloud/x1000-intelligence-hippique-v2"|\
  "git@github.com:yadcaf-cloud/x1000-intelligence-hippique-v2.git")
    echo "Depot GitHub : OK"
    ;;
  *)
    echo "ERREUR : depot distant inattendu"
    echo "$ORIGIN"
    exit 1
    ;;
esac

# Verifier la branche.
if [[ "$(git branch --show-current)" != "$BRANCHE" ]]; then
  echo "ERREUR : branche incorrecte"
  exit 1
fi

# Ne pas toucher aux modifications existantes.
if [[ -n "$(git status --porcelain)" ]]; then
  echo "ERREUR : modifications locales presentes"
  exit 1
fi

# Verifier les sources.
for fichier in "$WORKFLOW" "$SOURCE"; do
  if [[ ! -s "$fichier" ]]; then
    echo "ERREUR : source absente : $fichier"
    exit 1
  fi
done

# Ne jamais ecraser les pages existantes.
for fichier in index.html pmu.html dashboard_x1000.html; do
  if [[ -e "$fichier" ]]; then
    echo "ERREUR : page deja existante : $fichier"
    exit 1
  fi
done

# Publier le tableau de bord original sans le modifier.
cp "$SOURCE" dashboard_x1000.html

# Creer l'accueil public.
cat > index.html <<'HTML'
