# Verifications locales.
python - <<'PY'
from pathlib import Path
from html.parser import HTMLParser

class Verificateur(HTMLParser):
    def __init__(self):
        super().__init__()
        self.tags = set()

    def handle_starttag(self, tag, attrs):
        self.tags.add(tag)

for nom in (
    "index.html",
    "pmu.html",
    "dashboard_x1000.html",
):
    fichier = Path(nom)
    contenu = fichier.read_text(encoding="utf-8-sig")
    analyse = Verificateur()
    analyse.feed(contenu)
    analyse.close()

    assert {"html", "head", "body"} <= analyse.tags
    assert contenu.strip().lower().endswith("</html>")
    print("OK:", nom)

assert Path(
    ".github/workflows/"
    "preparation-operationnelle-x1000.yml"
).is_file()

print("Pages publiques : OK")
print("Workflow original : preserve")
PY

# Commit limite aux trois pages.
git add -- index.html pmu.html dashboard_x1000.html
git diff --cached --check

git commit -m \
  "fix: restaurer pages publiques X1000 sans modifier les moteurs"

git push origin "$BRANCHE"

echo "=== REPARATION ENVOYEE ==="
echo "Relancer et verifier GitHub Actions."
