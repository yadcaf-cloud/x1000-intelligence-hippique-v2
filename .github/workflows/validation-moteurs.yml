name: X1000 V2.4 - Validation securisee M1-M5

on:
  workflow_dispatch:
  push:
    branches:
      - feature/installation-x1000-v2
    paths:
      - "M*.py"
      - "m*.py"
      - "moteurs/**"
      - "tests/**"
      - "test_*.py"
      - "validation_moteurs.py"
      - "coordination_x1000.py"
      - "config_x1000.py"
      - ".github/workflows/validation-moteurs.yml"

permissions:
  contents: read

concurrency:
  group: x1000-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    name: Controle M1-M5 sans publication
    if: github.ref == 'refs/heads/feature/installation-x1000-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONPATH: "."

    steps:
      - name: Recuperer branche securisee
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verifier branche
        shell: bash
        run: |
          set -euo pipefail

          test "$GITHUB_REF" = \
            "refs/heads/feature/installation-x1000-v2"

          test "$(git branch --show-current)" = \
            "feature/installation-x1000-v2"

          echo "Branche securisee : OK"

      - name: Verifier syntaxe Python
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          from pathlib import Path

          excluded = {
              ".git",
              ".venv",
              "venv",
              "__pycache__",
              "node_modules",
              "site-packages"
          }

          files = sorted(
              p for p in Path(".").rglob("*.py")
              if not any(
                  part in excluded
                  or part.startswith(".")
                  for part in p.parts
              )
          )

          if not files:
              raise SystemExit(
                  "ERREUR : aucun fichier Python"
              )

          for path in files:
              ast.parse(
                  path.read_text(
                      encoding="utf-8-sig"
                  ),
                  filename=str(path)
              )
              print("SYNTAXE OK :", path)

          print("Fichiers controles :", len(files))
          PY

      - name: Verifier cinq moteurs independants
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          root = Path(".")
          folder = Path("moteurs")
          found = []

          for number in range(1, 6):
              names = (
                  f"m{number}.py",
                  f"M{number}.py"
              )

              candidates = [
                  base / name
                  for base in (folder, root)
                  for name in names
                  if (base / name).is_file()
              ]

              if not candidates:
                  raise SystemExit(
                      f"ERREUR : moteur M{number} absent"
                  )

              for path in candidates:
                  if path.stat().st_size == 0:
                      raise SystemExit(
                          f"ERREUR : moteur vide {path}"
                      )

              chosen = candidates[0]
              found.append(chosen)

              print(
                  f"M{number} : PRESENT - {chosen}"
              )

              if len(candidates) > 1:
                  print(
                      f"AVERTISSEMENT M{number} : "
                      "plusieurs fichiers detectes"
                  )

          if len(found) != 5:
              raise SystemExit(
                  "ERREUR : cinq moteurs requis"
              )

          print("M1-M5 : PRESENCE CONFIRMEE")
          print(
              "Independance fonctionnelle "
              "non prouvee par ce controle"
          )
          PY

      - name: Verifier composants centraux
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          required = (
              "validation_moteurs.py",
              "coordination_x1000.py",
              "config_x1000.py"
          )

          for name in required:
              path = Path(name)

              if not path.is_file():
                  raise SystemExit(
                      f"ERREUR : fichier absent {name}"
                  )

              if path.stat().st_size == 0:
                  raise SystemExit(
                      f"ERREUR : fichier vide {name}"
                  )

              print("COMPOSANT OK :", name)
          PY

      - name: Executer tests Python
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import sys
          import unittest
          from pathlib import Path

          loader = unittest.TestLoader()
          suite = unittest.TestSuite()

          for path in sorted(
              Path(".").glob("test_*.py")
          ):
              suite.addTests(
                  loader.loadTestsFromName(
                      path.stem
                  )
              )

          folder = Path("tests")

          if folder.is_dir():
              suite.addTests(
                  loader.discover(
                      start_dir=str(folder),
                      pattern="test_*.py",
                      top_level_dir=str(folder)
                  )
              )

          count = suite.countTestCases()

          if count == 0:
              raise SystemExit(
                  "ERREUR : aucun test decouvert"
              )

          print("Tests decouverts :", count)

          result = unittest.TextTestRunner(
              verbosity=2
          ).run(suite)

          if not result.wasSuccessful():
              sys.exit(1)

          print("Tests Python : REUSSIS")
          PY

      - name: Verifier depot inchange
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "Verification du depot"

          if ! git diff --quiet ||
             ! git diff --cached --quiet; then
            echo "::error::Fichiers suivis modifies"
            exit 1
          fi

          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Fichiers non suivis crees"
            exit 1
          fi

          echo "Depot inchange : OK"

      - name: Bilan de validation
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## X1000 V2.4 - M1 a M5"
            echo ""
            echo "- Branche securisee : OK"
            echo "- Syntaxe Python : OK"
            echo "- Cinq moteurs : presents"
            echo "- Composants centraux : presents"
            echo "- Tests Python : reussis"
            echo "- Depot : inchange"
            echo "- Publication : aucune"
            echo "- FIGE : aucun par le workflow"
            echo "- Commit automatique : aucun"
            echo ""
            echo "Aucune prediction publiee."
            echo "Autonomie sportive non certifiee."
          } >> "$GITHUB_STEP_SUMMARY"
