name: X1000 - Test fonctionnel reel M1-M5

on:
  workflow_dispatch:
  push:
    branches:
      - fix/x1000-v2-reparation-controlee
    paths:
      - "moteurs/**"
      - "tests/**"
      - ".github/workflows/test-fonctionnel-reel-m1-m5.yml"

permissions:
  contents: read

concurrency:
  group: x1000-test-reel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    name: X1000 M1-M5 - lecture seule
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      X1000_READ_ONLY: "1"
      X1000_NO_FIGE: "1"
      X1000_NO_PUBLICATION: "1"

    steps:
      - name: Recuperer branche de reparation
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verifier branche et fichiers
        shell: bash
        run: |
          set -euo pipefail

          test "$GITHUB_REF_NAME" = \
            "fix/x1000-v2-reparation-controlee"

          for f in m1 m2 m3 m4 m5; do
            test -f "moteurs/$f.py"
          done

          test -f moteurs/noyau_commun.py
          test -f tests/test_fonctionnel_reel_m1_m5.py

          echo "Branche et fichiers verifies"

      - name: Verifier les courses attestees
        id: courses
        shell: bash
        run: |
          set -euo pipefail

          python -B - <<'PY'
          import json
          import os
          from pathlib import Path

          dossier = Path("tests/donnees_reelles")
          fichiers = sorted(dossier.glob("*.json"))

          if not fichiers:
              print(
                  "::notice::Aucune course reelle "
                  "attestee disponible."
              )
              print(
                  "Les autotests techniques seront "
                  "executes sans courses reelles."
              )
              with open(
                  os.environ["GITHUB_OUTPUT"],
                  "a",
                  encoding="utf-8",
              ) as sortie:
                  sortie.write("courses=absentes\n")
          else:
              for fichier in fichiers:
                  data = json.loads(
                      fichier.read_text(encoding="utf-8")
                  )
                  if not isinstance(data, dict):
                      raise SystemExit(
                          "Structure JSON invalide"
                      )

                  preuve = data.get("preuve")
                  course = data.get("course")

                  if not isinstance(preuve, dict):
                      raise SystemExit(
                          "Preuve invalide"
                      )
                  if not isinstance(course, dict):
                      raise SystemExit(
                          "Course invalide"
                      )

                  if preuve.get(
                      "verification_humaine"
                  ) is not True:
                      raise SystemExit(
                          "Verification humaine absente"
                      )

                  url = preuve.get("source_url")
                  if (
                      not isinstance(url, str)
                      or not url.startswith("https://")
                  ):
                      raise SystemExit(
                          "Source HTTPS manquante"
                      )

                  if course.get(
                      "localisation_france_verifiee"
                  ) is not True:
                      raise SystemExit(
                          "Localisation France non verifiee"
                      )

                  if course.get(
                      "depart_verifie"
                  ) is not True:
                      raise SystemExit(
                          "Depart non verifie"
                      )

                  print(
                      "Fixture declaree attestee :",
                      fichier.name
                  )

              with open(
                  os.environ["GITHUB_OUTPUT"],
                  "a",
                  encoding="utf-8",
              ) as sortie:
                  sortie.write("courses=presentes\n")

              print("Nombre de courses :", len(fichiers))
          PY

      - name: Tester M1 a M5
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/test_fonctionnel_reel_m1_m5.py

      - name: Bilan du diagnostic
        if: success()
        shell: bash
        env:
          COURSES: ${{ steps.courses.outputs.courses }}
        run: |
          set -euo pipefail

          {
            echo "## X1000 - Diagnostic M1 a M5"
            echo ""
            echo "Branche de reparation uniquement."
            echo ""
            echo "- Lecture seule : active"
            echo "- FIGE : interdit"
            echo "- Publication : interdite"
            echo "- Collecte PMU : aucune dans ce workflow"
            echo ""
            if [[ "$COURSES" == "presentes" ]]; then
              echo "Courses : tests executes sur fixtures."
              echo "Sources a verifier independamment."
            else
              echo "Courses reelles : NON TESTEES."
              echo "Autotests techniques uniquement."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verifier absence de modifications
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          git diff --exit-code
          git diff --cached --exit-code

          test -z "$(
            git ls-files --others --exclude-standard
          )"

          echo "Depot de travail intact"
          echo "Controle de modifications termine"
