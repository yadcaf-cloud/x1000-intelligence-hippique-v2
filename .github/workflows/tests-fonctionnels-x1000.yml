name: X1000 - Tests fonctionnels M1 a M5

on:
  push:
    branches:
      - fix/x1000-v2-reparation-controlee
    paths:
      - "moteurs/**"
      - "tests/**"
      - ".github/workflows/tests-fonctionnels-x1000.yml"

  pull_request:
    paths:
      - "moteurs/**"
      - "tests/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-fonctionnels:
    name: Controle fonctionnel M1-M5
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verifier les fichiers moteurs
        shell: bash
        run: |
          set -euo pipefail

          for moteur in m1 m2 m3 m4 m5; do
            test -f "moteurs/${moteur}.py" || {
              echo "::error::Moteur ${moteur} absent"
              exit 1
            }
          done

          echo "Cinq fichiers moteurs presents"

      - name: Verifier la syntaxe
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q moteurs tests
          echo "Syntaxe Python conforme"

      - name: Autotests des cinq moteurs
        shell: bash
        run: |
          set -euo pipefail

          for moteur in m1 m2 m3 m4 m5; do
            echo "Verification du moteur ${moteur}"
            python -m moteurs.${moteur} --self-test
          done

          echo "Autotests M1-M5 termines"

      - name: Tests des contrats
        shell: bash
        run: |
          set -euo pipefail

          FICHIER="tests/test_audit_contrats_x1000.py"

          if [ -f "$FICHIER" ]; then
            echo "Execution des tests des contrats"

            python -m unittest discover \
              -s tests \
              -p "test_audit_contrats_x1000.py" \
              -v
          else
            echo "::warning::Fichier de tests des contrats absent"
            echo "Tests des contrats non executes"
            echo "Restauration des tests recommandee"
          fi

      - name: Tests fonctionnels renforces
        shell: bash
        run: |
          set -euo pipefail

          FICHIER="tests/test_fonctionnel_x1000.py"

          if [ ! -f "$FICHIER" ]; then
            echo "::error::Tests fonctionnels absents"
            exit 1
          fi

          python -m unittest discover \
            -s tests \
            -p "test_fonctionnel_x1000.py" \
            -v

      - name: Controle termine
        if: success()
        shell: bash
        run: |
          echo "================================="
          echo "X1000 PHOENIX V2.4"
          echo "CONTROLE FONCTIONNEL TERMINE"
          echo "================================="
          echo "M1 M2 M3 M4 M5 : autotests OK"
          echo "Syntaxe Python : OK"
          echo "Tests fonctionnels : OK"
          echo "Contrats : voir etape dediee"
          echo "Aucune collecte PMU"
          echo "Aucun FIGE automatique"
          echo "Aucune publication automatique"
          echo "Aucun deploiement automatique"
          echo "Aucun commit ni push automatique"
          echo "================================="
