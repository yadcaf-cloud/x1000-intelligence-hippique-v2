name: X1000 - Diagnostic securise M1-M5

run-name: Diagnostic sans publication

on:
  workflow_dispatch:
  push:
    branches:
      - fix/x1000-v2-reparation-controlee
    paths:
      - "moteurs/**"
      - "m1.py"
      - "m2.py"
      - "m3.py"
      - "m4.py"
      - "m5.py"
      - "noyau_commun.py"
      - "validation_moteurs.py"
      - "coordination_x1000.py"
      - "test_validation_moteurs.py"
      - "test_coordination_x1000.py"
      - ".github/workflows/diagnostic-moteurs.yml"

permissions:
  contents: read

concurrency:
  group: x1000-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    if: github.ref == 'refs/heads/fix/x1000-v2-reparation-controlee'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONUNBUFFERED: "1"

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout sans identifiants persistants
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verifier la branche
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF_NAME" = \
            "fix/x1000-v2-reparation-controlee"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Verifier syntaxe et fichiers
        run: |
          set -Eeuo pipefail
          python -B - <<'PY'
          import ast
          from pathlib import Path

          files = [
              "m1.py", "m2.py", "m3.py",
              "m4.py", "m5.py",
              "noyau_commun.py",
              "moteurs/noyau_commun.py",
              "validation_moteurs.py",
              "coordination_x1000.py",
              "test_validation_moteurs.py",
              "test_coordination_x1000.py",
          ]

          for name in files:
              path = Path(name)
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(
                      f"Fichier absent ou interdit: {name}"
                  )
              if path.stat().st_size > 1024 * 1024:
                  raise SystemExit(
                      f"Fichier trop volumineux: {name}"
                  )
              ast.parse(
                  path.read_text(encoding="utf-8-sig"),
                  filename=name
              )
              print("SYNTAXE OK:", name)
          PY

      - name: Creer copie temporaire
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/x1000-isole"
          git archive HEAD | tar -xf - \
            -C "$RUNNER_TEMP/x1000-isole"

      - name: Executer tests isoles
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/x1000-isole"
          python -B test_validation_moteurs.py
          python -B test_coordination_x1000.py

      - name: Verifier depot original
        if: always()
        run: |
          set -Eeuo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain)"

      - name: Bilan
        if: success()
        run: |
          {
            echo "## X1000 - Diagnostic reussi"
            echo "- Tests M1-M5 executes"
            echo "- Aucune publication"
            echo "- Aucun FIGE automatique"
            echo "- Aucune modification du depot"
            echo "- Aucun deploiement"
          } >> "$GITHUB_STEP_SUMMARY"
