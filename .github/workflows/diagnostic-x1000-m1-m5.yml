name: X1000 - Diagnostic M1 à M5

on:
  push:
    branches:
      - fix/x1000-v2-reparation-controlee
    paths:
      - "moteurs/**"
      - "tests/test_audit_contrats_x1000.py"
      - ".github/workflows/diagnostic-x1000-m1-m5.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic-moteurs:
    name: Verification M1-M5
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verifier les fichiers
        run: |
          test -f moteurs/m1.py
          test -f moteurs/m2.py
          test -f moteurs/m3.py
          test -f moteurs/m4.py
          test -f moteurs/m5.py
          test -f moteurs/noyau_commun.py
          test -f tests/test_audit_contrats_x1000.py

      - name: Executer les tests X1000
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: "."
          X1000_READ_ONLY: "1"
          X1000_NO_FIGE: "1"
          X1000_NO_PUBLICATION: "1"
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_audit_contrats_x1000.py" \
            -v
