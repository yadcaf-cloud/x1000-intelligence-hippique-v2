name: X1000 V2 - Verification API Python

on:
  workflow_dispatch:

  push:
    paths:
      - "api.py"
      - "requirements.txt"
      - ".github/workflows/verification-api-x1000-v2.yml"

  pull_request:
    paths:
      - "api.py"
      - "requirements.txt"
      - ".github/workflows/verification-api-x1000-v2.yml"

permissions:
  contents: read

concurrency:
  group: x1000-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verification:
    name: Verification API lecture seule
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONNOUSERSITE: "1"

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configurer le repertoire temporaire
        shell: bash
        run: |
          set -euo pipefail
          DATA_DIR="${RUNNER_TEMP}/x1000-data"
          mkdir -p "$DATA_DIR"
          echo "X1000_DATA_DIR=$DATA_DIR" >> "$GITHUB_ENV"

      - name: Verifier les fichiers
        shell: bash
        run: |
          set -euo pipefail
          test -f api.py
          test -f requirements.txt
          echo "Fichiers presents"

      - name: Installer les dependances
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "httpx>=0.27,<1.0"
          python -m pip check

      - name: Verifier la syntaxe Python
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("api.py").read_text(
              encoding="utf-8"
          )
          ast.parse(source)
          print("Syntaxe Python valide")
          PY

      - name: Tester les six endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from fastapi.testclient import TestClient
          from api import app

          endpoints = [
              "/api/status",
              "/api/courses",
              "/api/selections",
              "/api/figes",
              "/api/audits",
              "/api/diagnostic",
          ]

          with TestClient(app) as client:

              for endpoint in endpoints:
                  response = client.get(endpoint)

                  assert response.status_code == 200, (
                      endpoint,
                      response.status_code,
                      response.text,
                  )

                  assert isinstance(
                      response.json(), dict
                  )

                  print("OK", endpoint)

              status = client.get(
                  "/api/status"
              ).json()

              assert set(status["moteurs"]) == {
                  "M1", "M2", "M3", "M4", "M5"
              }

              assert status[
                  "collecte_automatique"
              ] is False

              assert status[
                  "figes_automatiques"
              ] is False

              assert status[
                  "publication_automatique"
              ] is False

              assert status[
                  "validation_officielle_automatique"
              ] is False

              assert status["mode"] == (
                  "LECTURE_SEULE_WEB"
              )

              print("Moteurs M1-M5 verifies")
              print("Automatismes interdits verifies")

              for method in (
                  "POST", "PUT", "PATCH", "DELETE"
              ):
                  response = client.request(
                      method, "/api/courses"
                  )

                  assert response.status_code == 405, (
                      method,
                      response.status_code,
                  )

                  print("Methode bloquee:", method)

              allowed = client.get(
                  "/api/status",
                  headers={
                      "Origin":
                      "https://yadcaf-cloud.github.io"
                  },
              )

              assert allowed.headers.get(
                  "access-control-allow-origin"
              ) == "https://yadcaf-cloud.github.io"

              denied = client.get(
                  "/api/status",
                  headers={
                      "Origin": "https://example.com"
                  },
              )

              assert denied.headers.get(
                  "access-control-allow-origin"
              ) is None

              print("Controle CORS valide")
              print("Lecture seule valide")
              print("Verification X1000 V2 terminee")
          PY
