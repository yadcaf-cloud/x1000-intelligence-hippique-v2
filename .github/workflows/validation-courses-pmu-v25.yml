name: X1000 - Validation locale courses France

on:
  workflow_dispatch:
  push:
    branches:
      - fix/x1000-v2-reparation-controlee
    paths:
      - "validation_courses_pmu_v25.py"
      - "courses.json"
      - "data/courses.json"
      - ".github/workflows/validation-courses-pmu-v25.yml"

permissions:
  contents: read

jobs:
  validation:
    if: github.ref == 'refs/heads/fix/x1000-v2-reparation-controlee'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      TZ: Europe/Paris

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Valider dans une copie isolee
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$RUNNER_TEMP/x1000-courses"
          git archive HEAD | tar -xf - \
            -C "$RUNNER_TEMP/x1000-courses"

          cd "$RUNNER_TEMP/x1000-courses"

          python -B - <<'PY'
          import ast
          from pathlib import Path

          path = Path("validation_courses_pmu_v25.py")
          if not path.is_file() or path.is_symlink():
              raise SystemExit("Validateur absent")

          ast.parse(
              path.read_text(encoding="utf-8-sig"),
              filename=str(path)
          )

          sources = [
              Path("courses.json"),
              Path("data/courses.json"),
          ]

          if any(p.is_symlink() for p in sources):
              raise SystemExit("Lien symbolique interdit")

          if sum(p.is_file() for p in sources) > 1:
              raise SystemExit("Sources ambiguës")

          print("Syntaxe et sources controlees")
          PY

          python -B validation_courses_pmu_v25.py \
            --self-test

      - name: Verifier depot original
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "$(git status --porcelain)"

      - name: Bilan
        if: success()
        run: |
          echo "Validation locale terminee" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "Aucune collecte automatique" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "Aucune publication ni FIGE" \
            >> "$GITHUB_STEP_SUMMARY"
