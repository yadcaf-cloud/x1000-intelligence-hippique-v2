name: X1000 - Audit PMU hors reseau

on:
  workflow_dispatch:
  push:
    branches:
      - fix/x1000-v2-reparation-controlee
    paths:
      - "audit_collecte_pmu.py"
      - ".github/workflows/audit-collecte-pmu-v24.yml"

permissions:
  contents: read

jobs:
  audit:
    if: github.ref == 'refs/heads/fix/x1000-v2-reparation-controlee'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit local isole
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$RUNNER_TEMP/x1000-audit"
          git archive HEAD | tar -xf - \
            -C "$RUNNER_TEMP/x1000-audit"

          cd "$RUNNER_TEMP/x1000-audit"

          python -B - <<'PY'
          import ast
          from pathlib import Path

          path = Path("audit_collecte_pmu.py")

          if not path.is_file() or path.is_symlink():
              raise SystemExit("Script absent")

          tree = ast.parse(
              path.read_text(encoding="utf-8-sig")
          )

          names = {
              n.name for n in tree.body
              if isinstance(
                  n, (ast.FunctionDef, ast.AsyncFunctionDef)
              )
          }

          required = {"main", "verifier_url", "decoder_json",
                      "recuperer_json", "inspecter_programme"}

          if not required <= names:
              raise SystemExit("Interfaces manquantes")

          print("Audit statique conforme")
          PY

          python -B audit_collecte_pmu.py --self-test

      - name: Integrite du depot
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "$(git status --porcelain)"

      - name: Bilan
        if: success()
        run: |
          echo "Audit statique et autotests termines" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "Aucune collecte PMU demandee" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "Aucun FIGE ni publication" \
            >> "$GITHUB_STEP_SUMMARY"
