#!/usr/bin/env bash
set -euo pipefail

# X1000 PHOENIX V2.4
# REPARATION CONTROLEE DU WORKFLOW M1-M5
# Aucun commit, push, deploiement ou FIGE.

REPO="x1000-intelligence-hippique-v2"
BRANCHE="fix/x1000-v2-reparation-controlee"
FICHIER=".github/workflows/controle-technique-m1-m5-v2.yml"

echo "=== X1000 PHOENIX - REPARATION ==="

# 1. Verification du depot
if ! git rev-parse --show-toplevel >/dev/null 2>&1; then
  echo "ERREUR : executer depuis le depot Git."
  exit 1
fi

cd "$(git rev-parse --show-toplevel)"

if [ "$(basename "$PWD")" != "$REPO" ]; then
  echo "ERREUR : depot inattendu."
  exit 1
fi

if [ "$(git branch --show-current)" != "$BRANCHE" ]; then
  echo "ERREUR : branche non autorisee."
  exit 1
fi

if [ ! -f "$FICHIER" ]; then
  echo "ERREUR : workflow introuvable."
  exit 1
fi

if ! git diff --quiet -- "$FICHIER" ||
   ! git diff --cached --quiet -- "$FICHIER"; then
  echo "ERREUR : modifications existantes du workflow."
  echo "Sauvegarder ou examiner ces modifications avant."
  exit 1
fi

# 2. Sauvegarde hors du depot
SAUVEGARDE="$(mktemp -d)"
cp "$FICHIER" "$SAUVEGARDE/workflow-original.yml"
echo "Sauvegarde : $SAUVEGARDE"

# 3. Remplacement du workflow
cat > "$FICHIER" <<'YAML'
name: X1000 V2 - Controle technique M1-M5

on:
  workflow_dispatch:

  schedule:
    - cron: "17 6 * * *"

  push:
    branches:
      - fix/x1000-v2-reparation-controlee
    paths:
      - "moteurs/**"
      - "tests/**"
      - "coordination_x1000.py"
      - "integration_x1000.py"
      - "validation_moteurs.py"
      - "api.py"
      - ".github/workflows/controle-technique-m1-m5-v2.yml"

permissions:
  contents: read

concurrency:
  group: x1000-v2-controle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  controle:
    name: Audit securise M1-M5
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      X1000_READ_ONLY: "1"
      X1000_NO_FIGE: "1"
      X1000_NO_PUBLICATION: "1"

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          ref: fix/x1000-v2-reparation-controlee
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Installer les dependances
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            "fastapi>=0.115,<1" \
            "httpx>=0.27,<1" \
            "pytest>=8,<10"

      - name: Preparer environnement isole
        shell: bash
        run: |
          set -euo pipefail

          DATA_DIR="$RUNNER_TEMP/x1000-data"
          mkdir -p "$DATA_DIR"

          echo "X1000_DATA_DIR=$DATA_DIR" >> "$GITHUB_ENV"
          echo "PYTEST_ADDOPTS=-p no:cacheprovider" >> "$GITHUB_ENV"

          echo "Environnement temporaire configure."

      - name: Verifier structure et syntaxe
        shell: bash
        run: |
          set -euo pipefail

          python -B - <<'PY'
          import ast
          from pathlib import Path

          essentiels = [
              "moteurs/noyau_commun.py",
              "coordination_x1000.py",
              "integration_x1000.py",
              "validation_moteurs.py",
              "api.py",
          ]

          essentiels += [
              f"moteurs/m{i}.py"
              for i in range(1, 6)
          ]

          for nom in essentiels:
              if not Path(nom).is_file():
                  raise RuntimeError(
                      f"Fichier obligatoire absent : {nom}"
                  )

          fichiers = set()

          for dossier in ("moteurs", "tests"):
              p = Path(dossier)
              if p.is_dir():
                  fichiers.update(p.rglob("*.py"))

          fichiers.update(map(Path, essentiels))

          for fichier in sorted(fichiers):
              ast.parse(
                  fichier.read_text(encoding="utf-8-sig"),
                  filename=str(fichier),
              )

          print("Structure et syntaxe : OK")
          PY

      - name: Tester M1 a M5 individuellement
        shell: bash
        run: |
          set -euo pipefail

          for moteur in m1 m2 m3 m4 m5; do
            echo "=== TEST $moteur ==="
            python -B -m "moteurs.$moteur" --self-test
          done

          echo "Cinq moteurs testes."

      - name: Verifier identite des moteurs
        shell: bash
        run: |
          set -euo pipefail

          python -B - <<'PY'
          import importlib
          from moteurs import noyau_commun

          assert str(noyau_commun.VERSION) == "2.4"

          for i in range(1, 6):
              nom = f"M{i}"
              module = importlib.import_module(
                  f"moteurs.m{i}"
              )

              assert module.MOTEUR == nom
              assert str(module.VERSION) == "2.4"

              for fonction in (
                  "verifier_noyau",
                  "analyser_course",
                  "self_test",
              ):
                  assert callable(
                      getattr(module, fonction, None)
                  ), f"{nom}: fonction absente {fonction}"

              assert module.COUVERTURE_MIN == 1.0

              print(f"{nom} : interface OK")

          print("Identite M1-M5 : OK")
          PY

      - name: Tester coordination centrale
        shell: bash
        run: |
          set -euo pipefail

          python -B - <<'PY'
          import integration_x1000 as integration
          import coordination_x1000 as coordination

          moteurs = integration.charger_moteurs()

          attendus = {
              "M1", "M2", "M3", "M4", "M5"
          }

          assert set(moteurs) == attendus
          assert callable(integration.coordonner)
          assert callable(coordination.coordonner)

          print("Chargement M1-M5 : OK")
          print("Coordination : OK")
          PY

      - name: Executer tests de regression
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d tests ]; then
            echo "ERREUR : dossier tests absent."
            exit 1
          fi

          if ! find tests -type f \
            -name 'test_*.py' | grep -q .; then
            echo "ERREUR : aucun test trouve."
            exit 1
          fi

          python -B -m pytest \
            tests \
            -v \
            --tb=short \
            -p no:cacheprovider

      - name: Tester API en lecture seule
        shell: bash
        run: |
          set -euo pipefail

          python -B - <<'PY'
          from fastapi.testclient import TestClient
          from api import app

          routes = (
              "/api/status",
              "/api/courses",
              "/api/selections",
              "/api/figes",
              "/api/audits",
              "/api/diagnostic",
          )

          with TestClient(app) as client:
              for route in routes:
                  reponse = client.get(route)

                  assert reponse.status_code == 200, (
                      route,
                      reponse.status_code,
                      reponse.text[:500],
                  )

                  print(f"GET {route} : OK")

                  for methode in (
                      "POST",
                      "PUT",
                      "PATCH",
                      "DELETE",
                  ):
                      reponse = client.request(
                          methode, route
                      )

                      assert reponse.status_code == 405, (
                          route,
                          methode,
                          reponse.status_code,
                      )

          print("API : controles termines.")
          PY

      - name: Verifier integrite du depot
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          git diff --exit-code HEAD --
          git diff --cached --exit-code HEAD --

          echo "Fichiers suivis inchanges."

          echo "Fichiers non suivis eventuels :"
          git ls-files --others --exclude-standard

          echo "Controle d'integrite termine."

      - name: Publier bilan technique
        if: always()
        shell: bash
        env:
          RESULTAT: ${{ job.status }}
        run: |
          {
            echo "## X1000 PHOENIX V2.4"
            echo ""
            echo "Resultat : $RESULTAT"
            echo ""
            echo "### Controles"
            echo "- Structure et syntaxe"
            echo "- M1 a M5 individuellement"
            echo "- Identite et interfaces"
            echo "- Coordination centrale"
            echo "- Tests de regression"
            echo "- API lecture seule"
            echo "- Integrite du depot"
            echo ""
            echo "### Protections"
            echo "- Aucun commit automatique"
            echo "- Aucun push automatique"
            echo "- Aucun deploiement"
            echo "- Aucun FIGE automatique"
            echo "- Aucune publication sportive"
            echo ""
            echo "Voir les etapes pour les resultats."
          } >> "$GITHUB_STEP_SUMMARY"
YAML

# 4. Verification syntaxique du YAML
echo "=== VERIFICATION YAML ==="

if python -c "import yaml" >/dev/null 2>&1; then
  python - "$FICHIER" <<'PY'
import sys
import yaml

with open(sys.argv[1], encoding="utf-8") as f:
    data = yaml.safe_load(f)

assert isinstance(data, dict)
assert "jobs" in data
assert "controle" in data["jobs"]

print("YAML : structure valide")
PY
else
  echo "PyYAML absent : validation YAML non executee."
fi

# 5. Verification du changement
echo "=== DIFFERENCES ==="
git diff --check -- "$FICHIER"
git diff --stat -- "$FICHIER"

echo ""
echo "=== REPARATION LOCALE TERMINEE ==="
echo "Workflow : $FICHIER"
echo "Branche : $BRANCHE"
echo "Sauvegarde : $SAUVEGARDE"
echo ""
echo "Aucun commit."
echo "Aucun push."
echo "Aucun deploiement."
echo "Aucun FIGE."
echo ""
echo "Examiner le diff avant toute publication."
