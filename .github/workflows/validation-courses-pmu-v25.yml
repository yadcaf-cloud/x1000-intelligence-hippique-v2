name: X1000 V2.5 - Validation courses PMU France

on:
  workflow_dispatch:

  push:
    branches:
      - feature/installation-x1000-v2
    paths:
      - validation_courses_pmu_v25.py
      - audit_collecte_pmu.py
      - .github/workflows/validation-courses-pmu-v25.yml

permissions:
  contents: read

concurrency:
  group: x1000-v25-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    name: Validation France sans publication
    if: github.ref == 'refs/heads/feature/installation-x1000-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONNOUSERSITE: "1"

    steps:
      - name: Recuperer branche securisee
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verifier branche fichiers et syntaxe
        shell: bash
        run: |
          set -euo pipefail

          test "$GITHUB_REF" = \
            "refs/heads/feature/installation-x1000-v2"

          python - <<'PY'
          import ast
          from pathlib import Path

          for nom in (
              "audit_collecte_pmu.py",
              "validation_courses_pmu_v25.py",
          ):
              fichier = Path(nom)
              if not fichier.is_file():
                  raise SystemExit(f"Fichier absent : {nom}")

              ast.parse(
                  fichier.read_text(encoding="utf-8"),
                  filename=nom,
              )
              print(f"OK : {nom}")

          print("Syntaxe Python conforme")
          PY

      - name: Executer validation PMU
        shell: bash
        run: |
          set -euo pipefail
          python validation_courses_pmu_v25.py \
            > "$RUNNER_TEMP/validation-v25.json"

      - name: Verifier rapport et securite
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          def exiger(condition, message):
              if not condition:
                  raise ValueError(message)

          def sans_doublons(paires):
              resultat = {}
              for cle, valeur in paires:
                  if cle in resultat:
                      raise ValueError(
                          f"Cle JSON dupliquee : {cle}"
                      )
                  resultat[cle] = valeur
              return resultat

          def constante_interdite(valeur):
              raise ValueError(
                  f"Constante JSON interdite : {valeur}"
              )

          chemin = (
              Path(os.environ["RUNNER_TEMP"])
              / "validation-v25.json"
          )

          exiger(chemin.is_file(), "Rapport absent")
          exiger(
              0 < chemin.stat().st_size <= 2_000_000,
              "Taille du rapport invalide"
          )

          data = json.loads(
              chemin.read_text(encoding="utf-8"),
              object_pairs_hook=sans_doublons,
              parse_constant=constante_interdite,
          )

          exiger(isinstance(data, dict), "Rapport invalide")
          exiger(data.get("version") == "2.5", "Version invalide")
          exiger(
              data.get("statut")
              == "VALIDATION_TECHNIQUE_SANS_PUBLICATION",
              "Statut technique invalide"
          )

          for cle in (
              "publication",
              "fige",
              "validation_sportive",
              "transmission_moteurs",
          ):
              exiger(
                  data.get(cle) is False,
                  f"Interdiction non respectee : {cle}"
              )

          maintenant = datetime.now(timezone.utc)
          date_paris = maintenant.astimezone(
              ZoneInfo("Europe/Paris")
          ).date()

          exiger(
              data.get("date") == date_paris.isoformat(),
              "Date PMU incorrecte"
          )

          source = (
              "https://online.turfinfo.api.pmu.fr"
              "/rest/client/1/programme/"
              + date_paris.strftime("%d%m%Y")
          )
          exiger(data.get("source") == source, "Source incorrecte")

          empreinte = data.get("source_sha256")
          exiger(
              isinstance(empreinte, str)
              and re.fullmatch(r"[0-9a-f]{64}", empreinte) is not None,
              "Empreinte source invalide"
          )

          collecte = data.get("collecte_a")
          exiger(isinstance(collecte, str), "Collecte absente")

          horodatage = datetime.fromisoformat(
              collecte.replace("Z", "+00:00")
          )
          exiger(
              horodatage.tzinfo is not None
              and horodatage.utcoffset() is not None,
              "Fuseau horaire absent"
          )
          exiger(
              abs((maintenant - horodatage).total_seconds()) <= 600,
              "Collecte hors tolerance"
          )

          courses = data.get("courses")
          exiger(isinstance(courses, list), "Courses invalides")
          exiger(len(courses) <= 150, "Trop de courses")

          compteurs = {"OK": 0, "PARTIEL": 0, "REFUSE": 0}
          identifiants = set()

          for course in courses:
              exiger(isinstance(course, dict), "Course invalide")

              identifiant = course.get("id")
              exiger(
                  isinstance(identifiant, str)
                  and re.fullmatch(
                      r"R[1-9]\d*C[1-9]\d*", identifiant
                  ) is not None,
                  "Identifiant course invalide"
              )
              exiger(
                  identifiant not in identifiants,
                  "Course dupliquee"
              )
              identifiants.add(identifiant)

              statut = course.get("statut")
              exiger(statut in compteurs, "Statut inconnu")
              compteurs[statut] += 1

              if statut != "OK":
                  raison = course.get("raison")
                  exiger(
                      isinstance(raison, str)
                      and bool(raison.strip()),
                      "Motif de refus ou statut partiel absent"
                  )
                  continue

              for cle in (
                  "localisation_france_verifiee",
                  "depart_programme_verifie",
                  "partants_verifies",
              ):
                  exiger(
                      course.get(cle) is True,
                      f"Verification absente : {cle}"
                  )

              exiger(
                  course.get("depart_effectif_verifie") is False,
                  "Depart effectif non prouve"
              )

              depart = course.get("depart")
              exiger(
                  isinstance(depart, str),
                  "Horaire de depart absent"
              )
              dt = datetime.fromisoformat(
                  depart.replace("Z", "+00:00")
              )
              exiger(
                  dt.tzinfo is not None
                  and dt.utcoffset() is not None,
                  "Depart sans fuseau"
              )
              exiger(
                  dt.astimezone(
                      ZoneInfo("Europe/Paris")
                  ).date() == date_paris,
                  "Date de depart incoherente"
              )

              actifs = course.get("partants")
              np = course.get("non_partants")
              nombre = course.get("nombre_partants")

              exiger(isinstance(actifs, list), "Partants invalides")
              exiger(isinstance(np, list), "Non-partants invalides")
              exiger(
                  type(nombre) is int
                  and nombre > 0
                  and nombre == len(actifs),
                  "Nombre de partants incoherent"
              )

              numeros = set()

              for liste, attendu in ((actifs, False), (np, True)):
                  for cheval in liste:
                      exiger(
                          isinstance(cheval, dict),
                          "Cheval invalide"
                      )

                      numero = cheval.get("numero")
                      nom = cheval.get("nom")

                      exiger(
                          type(numero) is int and numero > 0,
                          "Numero cheval invalide"
                      )
                      exiger(
                          numero not in numeros,
                          "Numero cheval duplique"
                      )
                      numeros.add(numero)

                      exiger(
                          isinstance(nom, str)
                          and bool(nom.strip()),
                          "Nom cheval absent"
                      )
                      exiger(
                          cheval.get("non_partant") is attendu,
                          "Statut partant incoherent"
                      )

          correspondances = {
              "OK": "courses_france_verifiees",
              "PARTIEL": "courses_partielles",
              "REFUSE": "courses_refusees",
          }

          for statut, cle in correspondances.items():
              exiger(
                  type(data.get(cle)) is int
                  and data[cle] == compteurs[statut],
                  f"Compteur incoherent : {cle}"
              )

          print("X1000 V2.5 : RAPPORT CONFORME")
          print("Courses controlees :", len(courses))
          print("France OK :", compteurs["OK"])
          print("Partielles :", compteurs["PARTIEL"])
          print("Refusees :", compteurs["REFUSE"])
          print("Publication : NON")
          print("FIGE : NON")
          print("M1-M5 : NON ALIMENTES")
          PY

      - name: Bilan GitHub
        if: success()
        shell: bash
        run: |
          {
            echo "## X1000 V2.5"
            echo ""
            echo "- Rapport technique : conforme"
            echo "- Branche securisee : OK"
            echo "- Localisation et partants : controles selon rapport"
            echo "- Publication : aucune"
            echo "- FIGE : aucun"
            echo "- Transmission M1-M5 : aucune"
            echo "- Archives : non modifiees"
            echo ""
            echo "Aucune validation sportive effectuee."
            echo "Consulter les journaux pour les compteurs."
          } >> "$GITHUB_STEP_SUMMARY"
