name: X1000 V2.5 - Validation courses PMU France

on:
  workflow_dispatch:
  push:
    branches:
      - feature/installation-x1000-v2
    paths:
      - validation_courses_pmu_v25.py
      - courses.json
      - .github/workflows/validation-courses-pmu-v25.yml

permissions:
  contents: read

concurrency:
  group: x1000-v25-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    name: Validation France sans publication
    if: github.ref == 'refs/heads/feature/installation-x1000-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONNOUSERSITE: "1"

    steps:
      - name: Recuperer branche securisee
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verifier branche et syntaxe
        shell: bash
        run: |
          set -euo pipefail

          test "$GITHUB_REF" = \
            "refs/heads/feature/installation-x1000-v2"

          python - <<'PY'
          import ast
          from pathlib import Path

          name = "validation_courses_pmu_v25.py"
          path = Path(name)

          if not path.is_file():
              raise SystemExit(
                  "ERREUR : script de validation absent"
              )

          ast.parse(
              path.read_text(encoding="utf-8-sig"),
              filename=name
          )

          print("Syntaxe Python : OK")
          PY

      - name: Executer autotests V2.5
        shell: bash
        run: |
          set -euo pipefail
          python validation_courses_pmu_v25.py \
            --self-test

      - name: Verifier disponibilite des donnees
        id: donnees
        shell: bash
        run: |
          set -euo pipefail

          if [ -f courses.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Fichier courses.json present"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AUCUNE DONNEE : courses.json absent"
            echo "Aucune course inventee"
          fi

      - name: Executer validation des courses
        if: steps.donnees.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python validation_courses_pmu_v25.py \
            --input courses.json \
            --output "$RUNNER_TEMP/validation-v25.json"

      - name: Controler rapport V2.5
        if: steps.donnees.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  raise ValueError(message)

          def unique_pairs(pairs):
              result = {}
              for key, value in pairs:
                  require(
                      key not in result,
                      f"Cle JSON dupliquee : {key}"
                  )
                  result[key] = value
              return result

          def invalid_constant(value):
              raise ValueError(
                  f"Constante interdite : {value}"
              )

          report = (
              Path(os.environ["RUNNER_TEMP"])
              / "validation-v25.json"
          )

          require(
              report.is_file(),
              "Rapport absent"
          )

          require(
              0 < report.stat().st_size <= 2000000,
              "Taille rapport invalide"
          )

          data = json.loads(
              report.read_text(encoding="utf-8-sig"),
              object_pairs_hook=unique_pairs,
              parse_constant=invalid_constant
          )

          require(
              isinstance(data, dict),
              "Rapport non objet"
          )

          require(
              data.get("systeme") == "X1000 V2.5",
              "Systeme incorrect"
          )

          require(
              data.get("mode")
              == "VALIDATION_LOCALE_SANS_PUBLICATION",
              "Mode incorrect"
          )

          for key in (
              "validation_officielle",
              "collecte_automatique",
              "publication"
          ):
              require(
                  data.get(key) is False,
                  f"{key} doit etre false"
              )

          total = data.get("total")
          valid = data.get("valides")
          invalid = data.get("invalides")
          results = data.get("resultats")

          for key, value in (
              ("total", total),
              ("valides", valid),
              ("invalides", invalid)
          ):
              require(
                  type(value) is int
                  and value >= 0,
                  f"Compteur invalide : {key}"
              )

          require(
              isinstance(results, list),
              "Resultats invalides"
          )

          require(
              total == len(results),
              "Nombre de resultats incoherent"
          )

          require(
              valid + invalid == total,
              "Compteurs incoherents"
          )

          require(
              total > 0,
              "Aucune course dans le rapport"
          )

          require(
              invalid == 0,
              "Courses invalides detectees"
          )

          require(
              data.get("statut") == "VALIDE",
              "Statut non valide"
          )

          for item in results:
              require(
                  isinstance(item, dict),
                  "Resultat non objet"
              )
              require(
                  item.get("valide") is True,
                  "Course invalide"
              )
              require(
                  item.get("erreurs") == [],
                  "Erreurs de validation presentes"
              )

          print("X1000 V2.5 : RAPPORT CONFORME")
          print("Courses analysees :", total)
          print("Courses structurellement valides :", valid)
          print("Validation officielle : NON")
          print("Publication : NON")
          PY

      - name: Verifier absence de modifications
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet ||
             ! git diff --cached --quiet; then
            echo "::error::Fichiers suivis modifies"
            exit 1
          fi

          echo "Fichiers suivis inchanges"

      - name: Bilan GitHub
        if: success()
        shell: bash
        env:
          DONNEES_PRESENTES: ${{ steps.donnees.outputs.present }}
        run: |
          set -euo pipefail

          {
            echo "## X1000 V2.5"
            echo ""
            echo "- Autotests Python : reussis"
            echo "- Branche securisee : OK"
            echo "- Publication : aucune"
            echo "- FIGE : aucun par le workflow"
            echo "- Transmission M1-M5 : aucune"
            echo "- Archives : non modifiees"
            echo ""
            if [ "$DONNEES_PRESENTES" = "true" ]; then
              echo "Validation structurelle : conforme"
              echo "Donnees fournies : oui"
            else
              echo "Statut : AUCUNE DONNEE"
              echo "courses.json absent"
              echo "Aucune course validee"
            fi
            echo ""
            echo "Aucune validation officielle."
            echo "Aucune collecte automatique."
          } >> "$GITHUB_STEP_SUMMARY"
