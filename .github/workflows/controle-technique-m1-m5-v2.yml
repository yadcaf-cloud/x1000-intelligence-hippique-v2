name: X1000 V2 - Controle technique M1-M5

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches:
      - fix/x1000-v2-reparation-controlee
    paths:
      - "moteurs/**"
      - "tests/**"
      - "coordination_x1000.py"
      - "integration_x1000.py"
      - "validation_moteurs.py"
      - "api.py"
      - ".github/workflows/controle-technique-m1-m5-v2.yml"

permissions:
  contents: read

concurrency:
  group: x1000-v2-controle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  controle:
    name: Audit securise des cinq moteurs
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      X1000_READ_ONLY: "1"
      X1000_NO_FIGE: "1"
      X1000_NO_PUBLICATION: "1"

    steps:
      - name: Recuperer la branche
        uses: actions/checkout@v4
        with:
          ref: fix/x1000-v2-reparation-controlee
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Installer dependances de test
        run: |
          set -euo pipefail
          python -m pip install \
            "fastapi>=0.115,<1" \
            "httpx>=0.27,<1"

      - name: Preparer un environnement isole
        shell: bash
        run: |
          set -euo pipefail

          DATA_DIR="$RUNNER_TEMP/x1000-data"
          mkdir -p "$DATA_DIR"

          echo "X1000_DATA_DIR=$DATA_DIR" >> "$GITHUB_ENV"

          echo "Environnement de test isole : OK"
          echo "Mode lecture seule demande"
          echo "FIGES et publications desactives"

      - name: Verifier la structure et la syntaxe
        run: |
          python -B - <<'PY'
          import ast
          from pathlib import Path

          essentiels = [
              "moteurs/noyau_commun.py",
              "coordination_x1000.py",
              "integration_x1000.py",
              "validation_moteurs.py",
              "api.py",
          ]

          essentiels += [
              f"moteurs/m{i}.py"
              for i in range(1, 6)
          ]

          for nom in essentiels:
              p = Path(nom)
              if not p.is_file():
                  raise RuntimeError(
                      f"Fichier absent : {nom}"
                  )

          fichiers = [
              *Path("moteurs").rglob("*.py"),
              *Path("tests").rglob("test_*.py"),
              *[Path(n) for n in essentiels],
          ]

          for p in set(fichiers):
              ast.parse(
                  p.read_text(encoding="utf-8-sig"),
                  filename=str(p),
              )

          print("Structure et syntaxe : OK")
          PY

      - name: Tester individuellement M1 a M5
        run: |
          set -euo pipefail

          for moteur in m1 m2 m3 m4 m5
          do
            echo "=== CONTROLE $moteur ==="
            python -B -m moteurs."$moteur" --self-test
          done

      - name: Verifier identite et interfaces
        run: |
          python -B - <<'PY'
          import importlib

          from moteurs import noyau_commun

          assert str(noyau_commun.VERSION) == "2.4"

          for i in range(1, 6):
              nom = f"M{i}"
              module = importlib.import_module(
                  f"moteurs.m{i}"
              )

              assert module.MOTEUR == nom
              assert str(module.VERSION) == "2.4"

              for fonction in (
                  "verifier_noyau",
                  "analyser_course",
                  "self_test",
              ):
                  assert callable(
                      getattr(module, fonction, None)
                  ), (nom, fonction)

              assert module.COUVERTURE_MIN == 1.0

              print(nom, "interface conforme")

          print("Cinq moteurs independants : OK")
          PY

      - name: Tester la coordination
        run: |
          python -B - <<'PY'
          import integration_x1000 as integration
          import coordination_x1000 as coordination

          moteurs = integration.charger_moteurs()

          assert set(moteurs) == {
              "M1", "M2", "M3", "M4", "M5"
          }

          assert callable(integration.coordonner)
          assert callable(coordination.coordonner)

          print("Chargement des cinq moteurs : OK")
          print("Coordination : interface disponible")
          PY

      - name: Executer les tests de regression
        run: |
          set -euo pipefail

          if find tests -type f \
            -name 'test_*.py' | grep -q .
          then
            python -B -m unittest discover \
              -s tests \
              -p "test_*.py" \
              -v
          else
            echo "ERREUR: aucun test de regression"
            exit 1
          fi

      - name: Tester API en lecture seule
        run: |
          python -B - <<'PY'
          from fastapi.testclient import TestClient
          from api import app

          attendues = (
              "/api/status",
              "/api/courses",
              "/api/selections",
              "/api/figes",
              "/api/audits",
              "/api/diagnostic",
          )

          with TestClient(app) as client:
              for route in attendues:
                  reponse = client.get(route)
                  assert reponse.status_code == 200, (
                      route,
                      reponse.status_code,
                  )

                  for methode in (
                      "POST", "PUT", "PATCH", "DELETE"
                  ):
                      reponse = client.request(
                          methode, route
                      )
                      assert reponse.status_code == 405, (
                          route,
                          methode,
                          reponse.status_code,
                      )

          print("Six routes API : OK")
          print("Methodes de modification bloquees")
          PY

      - name: Verifier absence de modification
        if: always()
        run: |
          set -euo pipefail

          git diff --exit-code HEAD --
          git diff --cached --exit-code HEAD --

          if [ -n "$(
            git ls-files --others --exclude-standard
          )" ]; then
            echo "ERREUR: fichiers non suivis detectes"
            git ls-files --others --exclude-standard
            exit 1
          fi

          echo "Fichiers suivis : inchanges"
          echo "Aucun fichier non suivi cree"

      - name: Publier le bilan technique
        if: always()
        env:
          RESULTAT: ${{ job.status }}
        run: |
          {
            echo "## X1000 V2 - Controle technique"
            echo ""
            echo "**Resultat global : $RESULTAT**"
            echo ""
            echo "### Controles demandes"
            echo "- M1 : test individuel"
            echo "- M2 : test individuel"
            echo "- M3 : test individuel"
            echo "- M4 : test individuel"
            echo "- M5 : test individuel"
            echo "- Coordination : verification"
            echo "- Regression : verification"
            echo "- API : verification"
            echo ""
            echo "### Protections configurees"
            echo "- Mode lecture seule demande"
            echo "- Generation FIGE desactivee"
            echo "- Publication desactivee"
            echo "- Aucun push automatique"
            echo ""
            echo "Consulter les etapes pour le verdict."
          } >> "$GITHUB_STEP_SUMMARY"
