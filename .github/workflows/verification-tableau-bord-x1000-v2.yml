name: X1000 V2 - Verification tableau de bord

on:
  workflow_dispatch:
  push:
    branches:
      - fix/x1000-v2-reparation-controlee
    paths:
      - "api.py"
      - "index.html"
      - "pmu.html"
      - ".github/workflows/dashboard_x1000.html"
      - ".github/workflows/verification-tableau-bord-x1000-v2.yml"

permissions:
  contents: read

jobs:
  verification:
    name: Diagnostic API et tableau de bord
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      X1000_READ_ONLY: "1"
      X1000_NO_FIGE: "1"
      X1000_NO_PUBLICATION: "1"

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: |
          python -m pip install \
            "fastapi>=0.115,<1" \
            "httpx>=0.27,<1"

      - name: Preparer les donnees isolees
        shell: bash
        run: |
          set -euo pipefail
          echo "X1000_DATA_DIR=$RUNNER_TEMP/x1000-data" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/x1000-data"

      - name: Verifier les pages HTML
        shell: bash
        run: |
          python -B - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser

          class ControleHTML(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tags = set()
                  self.links = []

              def handle_starttag(self, tag, attrs):
                  self.tags.add(tag)
                  if tag == "a":
                      href = dict(attrs).get("href")
                      if href:
                          self.links.append(href)

          dashboard = Path(
              ".github/workflows/dashboard_x1000.html"
          )

          pages = [
              dashboard,
              Path("index.html"),
              Path("pmu.html"),
          ]

          for fichier in pages:
              if not fichier.is_file():
                  raise SystemExit(
                      f"ERREUR: page obligatoire absente: {fichier}"
                  )

              contenu = fichier.read_text(
                  encoding="utf-8-sig"
              )

              parser = ControleHTML()
              parser.feed(contenu)
              parser.close()

              for tag in ("html", "head", "body"):
                  if tag not in parser.tags:
                      raise SystemExit(
                          f"ERREUR: {fichier}: {tag} absent"
                      )

              if not contenu.strip().lower().endswith(
                  "</html>"
              ):
                  raise SystemExit(
                      f"ERREUR: {fichier}: fin HTML absente"
                  )

              print(f"OK: {fichier}")

          index = Path("index.html").read_text(
              encoding="utf-8-sig"
          )

          if "X1000 Intelligence Hippique V2" not in index:
              raise SystemExit(
                  "ERREUR: nom officiel X1000 V2 absent"
              )

          if "X1000 PHOENIX" in index.upper():
              raise SystemExit(
                  "ERREUR: reference PHOENIX incorrecte"
              )

          print("Controle HTML termine : OK")
          PY

      - name: Verifier API et moteurs
        shell: bash
        run: |
          python -B - <<'PY'
          from fastapi.testclient import TestClient
          from api import app

          routes = (
              "/api/status",
              "/api/courses",
              "/api/selections",
              "/api/figes",
              "/api/audits",
              "/api/diagnostic",
          )

          with TestClient(app) as client:
              for route in routes:
                  response = client.get(route)
                  assert response.status_code == 200, (
                      route, response.status_code
                  )
                  print(route, "OK")

              status = client.get(
                  "/api/status"
              ).json()

              assert set(status["moteurs"]) == {
                  "M1", "M2", "M3", "M4", "M5"
              }

              assert status[
                  "collecte_automatique"
              ] is False

              assert status[
                  "figes_automatiques"
              ] is False

              assert status[
                  "publication_automatique"
              ] is False

              assert status[
                  "validation_officielle_automatique"
              ] is False

              for route in routes:
                  for method in (
                      "POST", "PUT", "PATCH", "DELETE"
                  ):
                      response = client.request(
                          method, route
                      )
                      assert response.status_code == 405, (
                          route,
                          method,
                          response.status_code
                      )

          print("API lecture seule : OK")
          print("M1 a M5 references : OK")
          PY

      - name: Verifier absence de modification
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          git diff --exit-code HEAD --
          git diff --cached --exit-code HEAD --

          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "ERREUR: fichiers non suivis"
            exit 1
          fi

          echo "Depot inchange : OK"

      - name: Publier le diagnostic
        if: always()
        shell: bash
        run: |
          {
            echo "## X1000 Intelligence Hippique V2"
            echo ""
            echo "Statut : ${{ job.status }}"
            echo ""
            echo "- Verification index.html"
            echo "- Verification pmu.html"
            echo "- Verification tableau de bord existant"
            echo "- Verification des six routes API"
            echo "- Verification des references M1 a M5"
            echo "- Controle des methodes interdites"
            echo "- Verification du depot inchange"
            echo ""
            echo "Aucun FIGE genere."
            echo "Aucune archive modifiee."
            echo "Aucune publication automatique."
          } >> "$GITHUB_STEP_SUMMARY"
