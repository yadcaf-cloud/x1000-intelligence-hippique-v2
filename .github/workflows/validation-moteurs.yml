name: X1000 V2.4 - Validation securisee M1-M5

on:
  workflow_dispatch:
  push:
    branches:
      - feature/installation-x1000-v2
      - fix/x1000-v2-reparation-controlee
    paths:
      - "M*.py"
      - "m*.py"
      - "moteurs/**"
      - "tests/**"
      - "test_*.py"
      - "api.py"
      - "validation_moteurs.py"
      - "coordination_x1000.py"
      - "config_x1000.py"
      - ".github/workflows/validation-moteurs.yml"

permissions:
  contents: read

concurrency:
  group: x1000-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    name: Controle M1-M5 sans publication

    if: >-
      ${{
        github.ref == 'refs/heads/feature/installation-x1000-v2' ||
        github.ref == 'refs/heads/fix/x1000-v2-reparation-controlee'
      }}

    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONPATH: "."

    steps:

      # ======================================================
      # 1. RECUPERATION SECURISEE
      # ======================================================

      - name: Recuperer branche securisee
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ======================================================
      # 2. VERIFICATION DE LA BRANCHE
      # ======================================================

      - name: Verifier branche
        shell: bash
        run: |
          set -euo pipefail

          case "$GITHUB_REF" in
            refs/heads/feature/installation-x1000-v2|refs/heads/fix/x1000-v2-reparation-controlee)
              echo "Branche autorisee : $GITHUB_REF"
              ;;
            *)
              echo "::error::Branche non autorisee"
              exit 1
              ;;
          esac

          BRANCH="${GITHUB_REF#refs/heads/}"

          test "$(git branch --show-current)" = "$BRANCH"

          echo "Branche securisee : OK"

      # ======================================================
      # 3. SYNTAXE DE TOUS LES FICHIERS PYTHON
      # ======================================================

      - name: Verifier syntaxe Python
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          from pathlib import Path

          excluded = {
              ".git",
              ".venv",
              "venv",
              "__pycache__",
              "node_modules",
              "site-packages",
          }

          files = sorted(
              path
              for path in Path(".").rglob("*.py")
              if not any(
                  part in excluded or part.startswith(".")
                  for part in path.parts
              )
          )

          if not files:
              raise SystemExit(
                  "ERREUR : aucun fichier Python"
              )

          for path in files:
              ast.parse(
                  path.read_text(encoding="utf-8-sig"),
                  filename=str(path),
              )
              print("SYNTAXE OK :", path)

          print("Fichiers controles :", len(files))
          PY

      # ======================================================
      # 4. PRESENCE DES CINQ MOTEURS V2.4
      # ======================================================

      - name: Verifier cinq moteurs V2.4
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          folder = Path("moteurs")

          required = [
              folder / f"m{numero}.py"
              for numero in range(1, 6)
          ]

          required.append(
              folder / "noyau_commun.py"
          )

          for path in required:
              if not path.is_file():
                  raise SystemExit(
                      f"ERREUR : fichier absent {path}"
                  )

              if path.stat().st_size == 0:
                  raise SystemExit(
                      f"ERREUR : fichier vide {path}"
                  )

              print("PRESENT :", path)

          for numero in range(1, 6):
              for name in (
                  f"m{numero}.py",
                  f"M{numero}.py",
              ):
                  legacy = Path(name)

                  if legacy.is_file():
                      print(
                          "AVERTISSEMENT : ancien moteur "
                          f"present a la racine : {legacy}"
                      )

          print("Cinq moteurs V2.4 : PRESENTS")
          PY

      # ======================================================
      # 5. COMPOSANTS CENTRAUX
      # ======================================================

      - name: Verifier composants centraux
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          required = (
              "api.py",
              "validation_moteurs.py",
              "coordination_x1000.py",
              "config_x1000.py",
          )

          for name in required:
              path = Path(name)

              if not path.is_file():
                  raise SystemExit(
                      f"ERREUR : fichier absent {name}"
                  )

              if path.stat().st_size == 0:
                  raise SystemExit(
                      f"ERREUR : fichier vide {name}"
                  )

              print("COMPOSANT OK :", name)

          print("Composants centraux : OK")
          PY

      # ======================================================
      # 6. CHARGEMENT UNIFORME M1 A M5
      # ======================================================

      - name: Tester chargement API M1-M5
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import importlib
          from pathlib import Path

          import api
          from moteurs import noyau_commun

          if str(noyau_commun.VERSION) != "2.4":
              raise SystemExit(
                  "ERREUR : noyau commun incompatible"
              )

          required_functions = (
              "analyser_course",
              "verifier_course",
              "verifier_sortie_analyse",
              "executer",
          )

          for fonction in required_functions:
              if not callable(
                  getattr(noyau_commun, fonction, None)
              ):
                  raise SystemExit(
                      f"ERREUR : fonction absente {fonction}"
                  )

          for numero in range(1, 6):
              name = f"M{numero}"
              module_name = f"moteurs.m{numero}"

              if not api.engine_available(name):
                  raise SystemExit(
                      f"ERREUR : {name} absent dans API"
                  )

              expected = (
                  Path("moteurs") / f"m{numero}.py"
              ).resolve()

              actual = api.engine_path(name)

              if actual is None or actual.resolve() != expected:
                  raise SystemExit(
                      f"ERREUR : chemin API incorrect {name}"
                  )

              module = importlib.import_module(
                  module_name
              )

              if Path(module.__file__).resolve() != expected:
                  raise SystemExit(
                      f"ERREUR : mauvais module {name}"
                  )

              if getattr(module, "MOTEUR", None) != name:
                  raise SystemExit(
                      f"ERREUR : identite incorrecte {name}"
                  )

              if str(getattr(module, "VERSION", "")) != "2.4":
                  raise SystemExit(
                      f"ERREUR : version incorrecte {name}"
                  )

              if not callable(
                  getattr(module, "analyser_course", None)
              ):
                  raise SystemExit(
                      f"ERREUR : analyser_course absent {name}"
                  )

              print(f"IMPORT {name} : OK")

          print("Chargement M1-M5 : OK")
          PY

      # ======================================================
      # 7. CONTROLE DES DONNEES INSUFFISANTES
      # ======================================================

      - name: Tester absence de predictions inventees
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import importlib
          from datetime import datetime, timedelta, timezone

          from moteurs import noyau_commun

          depart = (
              datetime.now(timezone.utc)
              + timedelta(days=1)
          ).isoformat()

          course = {
              "id": "TEST-MOTEURS-SANS-DONNEES",
              "localisation_france_verifiee": True,
              "depart_verifie": True,
              "depart": depart,
              "nombre_partants": 5,
              "non_partants": [],
              "partants": [
                  {
                      "numero": numero,
                      "nom": f"Cheval test {numero}",
                      "non_partant": False,
                  }
                  for numero in range(1, 6)
              ],
          }

          for numero in range(1, 6):
              name = f"M{numero}"

              module = importlib.import_module(
                  f"moteurs.m{numero}"
              )

              resultat = module.analyser_course(course)

              noyau_commun.verifier_sortie_analyse(
                  course,
                  resultat,
              )

              if resultat.get("statut") != "DONNEES_INSUFFISANTES":
                  raise SystemExit(
                      f"ERREUR : statut incorrect {name}"
                  )

              if resultat.get("classement"):
                  raise SystemExit(
                      f"ERREUR : classement invente {name}"
                  )

              if resultat.get("classement_partiel"):
                  raise SystemExit(
                      f"ERREUR : classement partiel invente {name}"
                  )

              if resultat.get("fige") is not False:
                  raise SystemExit(
                      f"ERREUR : FIGE non autorise {name}"
                  )

              if resultat.get("publication") is not False:
                  raise SystemExit(
                      f"ERREUR : publication non autorisee {name}"
                  )

              print(
                  f"{name} : aucune prediction inventee"
              )

          print("Controle donnees insuffisantes : OK")
          PY

      # ======================================================
      # 8. TESTS PYTHON EXISTANTS
      # ======================================================

      - name: Executer tests Python
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import sys
          import unittest
          from pathlib import Path

          loader = unittest.TestLoader()
          suite = unittest.TestSuite()

          for path in sorted(Path(".").glob("test_*.py")):
              suite.addTests(
                  loader.loadTestsFromName(path.stem)
              )

          folder = Path("tests")

          if folder.is_dir():
              suite.addTests(
                  loader.discover(
                      start_dir=str(folder),
                      pattern="test_*.py",
                      top_level_dir=str(folder),
                  )
              )

          count = suite.countTestCases()

          if count == 0:
              raise SystemExit(
                  "ERREUR : aucun test Python decouvert"
              )

          print("Tests decouverts :", count)

          result = unittest.TextTestRunner(
              verbosity=2
          ).run(suite)

          if not result.wasSuccessful():
              sys.exit(1)

          print("Tests Python : REUSSIS")
          PY

      # ======================================================
      # 9. VERIFICATION DE L'API EN LECTURE SEULE
      # ======================================================

      - name: Verifier API lecture seule
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import api

          required = (
              "/api/status",
              "/api/courses",
              "/api/selections",
              "/api/figes",
              "/api/audits",
              "/api/diagnostic",
          )

          for route in required:
              if route not in api.ROUTES:
                  raise SystemExit(
                      f"ERREUR : route absente {route}"
                  )

          for method in (
              "do_POST",
              "do_PUT",
              "do_PATCH",
              "do_DELETE",
          ):
              if not callable(
                  getattr(api.Handler, method, None)
              ):
                  raise SystemExit(
                      f"ERREUR : protection absente {method}"
                  )

          print("Routes API : OK")
          print("Methodes d'ecriture bloquees : OK")
          PY

      # ======================================================
      # 10. VERIFICATION DU DEPOT INCHANGE
      # ======================================================

      - name: Verifier depot inchange
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "Verification du depot"

          if ! git diff --quiet ||
             ! git diff --cached --quiet; then
            echo "::error::Fichiers suivis modifies"
            exit 1
          fi

          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Fichiers non suivis crees"
            exit 1
          fi

          echo "Depot inchange : OK"

      # ======================================================
      # 11. BILAN FINAL
      # ======================================================

      - name: Bilan de validation
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## X1000 V2.4 - Validation M1-M5"
            echo ""
            echo "- Branche securisee : OK"
            echo "- Syntaxe Python : OK"
            echo "- Moteurs V2.4 : presents"
            echo "- Noyau commun : compatible"
            echo "- Chargement API M1-M5 : OK"
            echo "- Composants centraux : presents"
            echo "- Absence de predictions inventees : OK"
            echo "- Tests Python : reussis"
            echo "- Routes API : controlees"
            echo "- Depot : inchange"
            echo "- Publication automatique : aucune"
            echo "- FIGE automatique : aucun"
            echo "- Commit automatique : aucun"
            echo ""
            echo "Aucune prediction publiee."
            echo "Validation technique uniquement."
            echo "Fiabilite sportive non garantie."
          } >> "$GITHUB_STEP_SUMMARY"
