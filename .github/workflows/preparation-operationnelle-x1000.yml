HTML
cat > pmu.html <<'HTML'
<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#071521"><title>X1000 — Courses PMU France</title>
<style>:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#071521;color:#f0f7f5}*{box-sizing:border-box}body{max-width:900px;margin:auto;padding:24px;line-height:1.6}h1{color:#efce7e}section{background:#102838;border:1px solid #315263;border-radius:14px;padding:22px;margin:20px 0}a{color:#a7dfff}</style>
</head><body><header><h1>🏇 X1000 — Courses PMU France</h1><p>Analyses indépendantes M1 à M5</p></header><main><section><h2>Consultation des courses</h2><p>Les données sont disponibles dans le tableau de bord lorsqu'une API compatible est configurée.</p><a href="dashboard_x1000.html">Consulter le tableau de bord</a></section><section><h2>Intégrité des analyses</h2><p>Les FIGÉS et les archives restent protégés. Cette page ne modifie aucune donnée.</p></section></main><footer><a href="index.html">Retour à l'accueil</a></footer></body></html>
HTML

python - <<'PY'
from pathlib import Path
from html.parser import HTMLParser
from urllib.parse import urlsplit, unquote
import re
root = Path('.').resolve()
class Analyse(HTMLParser):
    def __init__(self):
        super().__init__(); self.tags=set(); self.refs=[]
    def handle_starttag(self, tag, attrs):
        self.tags.add(tag)
        self.refs.extend(v for k,v in attrs if k in ('href','src') and v)
for name in ('index.html','pmu.html','dashboard_x1000.html'):
    file=root/name
    content=file.read_text(encoding='utf-8-sig')
    parser=Analyse(); parser.feed(content); parser.close()
    assert {'html','head','body'} <= parser.tags, name
    assert content.strip().lower().endswith('</html>'), name
    for ref in parser.refs:
        url=urlsplit(ref)
        if url.scheme or url.netloc or not url.path or url.path.startswith('//'): continue
        path=unquote(url.path)
        target=(root/path.lstrip('/') if path.startswith('/') else file.parent/path).resolve()
        assert target.is_relative_to(root), ref
        if target.is_dir(): target=target/'index.html'
        assert target.is_file(), f'Lien local absent : {name}: {ref}'
    print('PAGE OK:', name)
workflow=Path('.github/workflows/preparation-operationnelle-x1000.yml').read_text()
for token in ('Controler six routes API','Tester moteurs M1-M5','Executer tests de regression','status','courses','selections','figes','audits','diagnostic'):
    assert token in workflow, token
assert not workflow.startswith('#!/usr/bin/env bash')
try:
    import yaml
except ImportError:
    print('PyYAML absent : controle structurel uniquement')
else:
    class Loader(yaml.SafeLoader): pass
    Loader.yaml_implicit_resolvers = {k:[(tag,pattern) for tag,pattern in values if tag!='tag:yaml.org,2002:bool'] for k,values in Loader.yaml_implicit_resolvers.items()}
    parsed=yaml.load(workflow,Loader=Loader)
    assert 'on' in parsed and 'jobs' in parsed and 'preparation' in parsed['jobs']
    print('YAML OK')
PY

git add -- "$WORKFLOW" index.html pmu.html dashboard_x1000.html
git diff --cached --check
# Verifier que seuls les quatre fichiers attendus sont indexes.
mapfile -t staged < <(git diff --cached --name-only)
[[ "${#staged[@]}" -eq 4 ]] || fail "Nombre de fichiers indexes inattendu"
for f in "${staged[@]}"; do
  case "$f" in "$WORKFLOW"|index.html|pmu.html|dashboard_x1000.html) ;; *) fail "Fichier indexe inattendu : $f" ;; esac
done

git commit -m "fix: restaurer workflow YAML et pages publiques X1000"
trap - ERR
rm -f "$BACKUP"
git push origin "$BRANCHE"
echo "X1000 : workflow et pages publies sur $BRANCHE"
echo "M1-M5, FIGES et archives non modifies par ce script"
