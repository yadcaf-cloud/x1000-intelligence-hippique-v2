name: X1000 - Recherche automatique quotidienne

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6,10,13,16 * * *"

permissions:
  contents: read

concurrency:
  group: x1000-recherche-quotidienne
  cancel-in-progress: false

jobs:
  recherche:
    name: Recherche courses PMU France - M1 a M5
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"

      X1000_READ_ONLY: "1"
      X1000_NO_FIGE: "1"
      X1000_NO_PUBLICATION: "1"

      X1000_BRANCHE_AUTORISEE: fix/x1000-v2-reparation-controlee

      X1000_SOURCE_URL: ${{ vars.X1000_SOURCE_URL }}
      X1000_SOURCE_HOST: online.turfinfo.api.pmu.fr

    steps:
      - name: Recuperer la branche autorisee
        uses: actions/checkout@v4
        with:
          ref: fix/x1000-v2-reparation-controlee
          persist-credentials: false
          clean: true

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verifier la branche et le depot
        shell: bash
        run: |
          set -euo pipefail

          BRANCHE="$(git branch --show-current)"

          if [ "$BRANCHE" != "$X1000_BRANCHE_AUTORISEE" ]; then
            echo "::error::Branche Git non autorisee"
            exit 1
          fi

          if [ "$GITHUB_REPOSITORY" != \
            "yadcaf-cloud/x1000-intelligence-hippique-v2" ]; then
            echo "::error::Depot GitHub non autorise"
            exit 1
          fi

          test -f recherche_courses_x1000.py
          test -f integration_x1000.py
          test -f validation_moteurs.py
          test -d moteurs

          echo "Branche autorisee : $BRANCHE"
          echo "Depot autorise : OK"

      - name: Verifier la source PMU
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import sys
          from urllib.parse import urlsplit

          url = os.environ.get("X1000_SOURCE_URL", "")
          host = os.environ.get("X1000_SOURCE_HOST", "")

          if not url or not host:
              sys.exit("ERREUR : source PMU absente")

          if url != url.strip():
              sys.exit("ERREUR : espaces dans URL PMU")

          if any(ord(c) < 33 or ord(c) > 126 for c in url):
              sys.exit("ERREUR : caractere invisible dans URL")

          try:
              parsed = urlsplit(url)
              port = parsed.port
          except ValueError:
              sys.exit("ERREUR : URL PMU invalide")

          if (
              parsed.scheme != "https"
              or parsed.hostname != host
              or parsed.username is not None
              or parsed.password is not None
              or port not in (None, 443)
              or parsed.fragment
          ):
              sys.exit("ERREUR : source HTTPS non autorisee")

          print("Source HTTPS autorisee : OK")
          print("Domaine :", host)
          PY

      - name: Verifier les protections
        shell: bash
        run: |
          set -euo pipefail

          test "$X1000_READ_ONLY" = "1"
          test "$X1000_NO_FIGE" = "1"
          test "$X1000_NO_PUBLICATION" = "1"

          echo "Lecture seule : ACTIVE"
          echo "FIGE automatique : INTERDIT"
          echo "Publication automatique : INTERDITE"

      - name: Recherche sportive et analyses M1-M5
        shell: bash
        env:
          GITHUB_HEAD_REF: ""
          GITHUB_REF_NAME: fix/x1000-v2-reparation-controlee
        run: |
          set -euo pipefail

          BRANCHE="$(git branch --show-current)"

          if [ "$BRANCHE" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Incoherence de branche"
            exit 1
          fi

          echo "Demarrage X1000 PHOENIX"
          echo "Branche : $BRANCHE"
          echo "Moteurs : M1 M2 M3 M4 M5"

          python -B recherche_courses_x1000.py

      - name: Verifier integrite du depot
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          git diff --exit-code
          git diff --cached --exit-code

          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Fichiers non suivis detectes"
            exit 1
          fi

          echo "Integrite du depot : OK"
          echo "Aucune modification detectee"

      - name: Bilan de securite
        if: always()
        shell: bash
        run: |
          {
            echo "## X1000 PHOENIX"
            echo ""
            echo "- Recherche PMU France"
            echo "- Moteurs M1 a M5"
            echo "- Coordination centrale"
            echo "- Branche de reparation controlee"
            echo "- Lecture seule imposee"
            echo "- Aucun FIGE automatique"
            echo "- Aucune publication automatique"
            echo "- Aucun commit ni push"
            echo "- Aucun deploiement"
            echo "- Verification integrite du depot"
            echo ""
            echo "Resultat recherche : ${{ steps.recherche.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
