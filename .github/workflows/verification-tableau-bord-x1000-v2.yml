name: X1000 V2 - Verification tableau de bord

on:
  workflow_dispatch:
  push:
    branches:
      - fix/x1000-v2-reparation-controlee
    paths:
      - "api.py"
      - "index.html"
      - "pmu.html"
      - ".github/workflows/verification-tableau-bord-x1000-v2.yml"

permissions:
  contents: read

jobs:
  verification:
    name: Diagnostic API et tableau de bord
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      X1000_READ_ONLY: "1"
      X1000_NO_FIGE: "1"
      X1000_NO_PUBLICATION: "1"

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4.3.1
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: |
          python -m pip install \
            "fastapi>=0.115,<1" \
            "httpx>=0.27,<1"

      - name: Preparer les donnees isolees
        shell: bash
        run: |
          set -euo pipefail
          echo "X1000_DATA_DIR=$RUNNER_TEMP/x1000-data" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/x1000-data"

      - name: Verifier le tableau de bord
        shell: bash
        run: |
          python -B - <<'PY'
          from pathlib import Path

          pages = ("index.html", "pmu.html")
          presentes = []

          for nom in pages:
              fichier = Path(nom)
              if fichier.is_file():
                  contenu = fichier.read_text(
                      encoding="utf-8-sig"
                  )
                  assert "<html" in contenu.lower(), nom
                  presentes.append(nom)
                  print(f"{nom}: structure HTML presente")
              else:
                  print(f"{nom}: absent sur cette branche")

          if not presentes:
              print(
                  "::warning::Aucune page HTML trouvee. "
                  "Tableau de bord non valide."
              )
          PY

      - name: Verifier API et moteurs
        shell: bash
        run: |
          python -B - <<'PY'
          from fastapi.testclient import TestClient
          from api import app

          routes = (
              "/api/status",
              "/api/courses",
              "/api/selections",
              "/api/figes",
              "/api/audits",
              "/api/diagnostic",
          )

          with TestClient(app) as client:
              for route in routes:
                  response = client.get(route)
                  assert response.status_code == 200, route
                  print(route, "OK")

              status = client.get("/api/status").json()
              moteurs = status["moteurs"]

              assert set(moteurs) == {
                  "M1", "M2", "M3", "M4", "M5"
              }

              assert status["collecte_automatique"] is False
              assert status["figes_automatiques"] is False
              assert status["publication_automatique"] is False

              for route in routes:
                  for method in (
                      "POST", "PUT", "PATCH", "DELETE"
                  ):
                      response = client.request(
                          method, route
                      )
                      assert response.status_code == 405

          print("API securisee : OK")
          print("Cinq moteurs references : OK")
          PY

      - name: Verifier aucune modification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD --
          git diff --cached --exit-code HEAD --

          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "ERREUR: fichiers non suivis"
            exit 1
          fi

          echo "Depot inchange : OK"

      - name: Publier le diagnostic
        if: always()
        shell: bash
        run: |
          {
            echo "## X1000 V2 - Tableau de bord"
            echo ""
            echo "Resultat du job : ${{ job.status }}"
            echo ""
            echo "- Diagnostic HTML"
            echo "- Verification des six routes API"
            echo "- Verification des cinq moteurs"
            echo "- Controle lecture seule"
            echo "- Controle absence de modification"
            echo ""
            echo "Aucun FIGE ni pronostic genere."
            echo "Aucune archive modifiee."
          } >> "$GITHUB_STEP_SUMMARY"
