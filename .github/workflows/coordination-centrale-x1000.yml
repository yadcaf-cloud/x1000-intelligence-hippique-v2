name: X1000 - Audit coordination centrale M1-M5

on:
  workflow_dispatch:
  push:
    branches:
      - fix/x1000-v2-reparation-controlee
    paths:
      - "coordination_x1000.py"
      - "integration_x1000.py"
      - "validation_moteurs.py"
      - "moteurs/**"
      - "tests/test_coordination_centrale_x1000.py"
      - ".github/workflows/coordination-centrale-x1000.yml"

permissions:
  contents: read

jobs:
  audit-coordination:
    name: Audit central M1-M5
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verifier les fichiers
        run: |
          test -f coordination_x1000.py
          test -f integration_x1000.py
          test -f validation_moteurs.py
          test -f moteurs/noyau_commun.py
          test -f tests/test_coordination_centrale_x1000.py
          for n in 1 2 3 4 5; do
            test -f "moteurs/m${n}.py"
          done

      - name: Verifier la syntaxe Python
        run: |
          python -m compileall -q \
            coordination_x1000.py \
            integration_x1000.py \
            validation_moteurs.py \
            moteurs \
            tests/test_coordination_centrale_x1000.py

      - name: Executer les tests renforces
        run: |
          python -m unittest \
            tests/test_coordination_centrale_x1000.py \
            -v

      - name: Verifier integration complete
        run: |
          python integration_x1000.py

      - name: Verifier la regression existante
        run: |
          python -m unittest \
            tests/test_regression_x1000_m1_m5.py \
            -v

      - name: Confirmation des protections
        run: |
          echo "Audit technique termine"
          echo "Aucune collecte PMU"
          echo "Aucun FIGE automatique"
          echo "Aucune publication automatique"
          echo "Aucune modification des archives"
