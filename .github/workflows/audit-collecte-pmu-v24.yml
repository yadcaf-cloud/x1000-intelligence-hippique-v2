name: X1000 V2.4 - Audit collecte PMU reelle

on:
  workflow_dispatch:
  push:
    branches:
      - feature/installation-x1000-v2
      - fix/x1000-v2-reparation-controlee
    paths:
      - "audit_collecte_pmu.py"
      - ".github/workflows/audit-collecte-pmu-v24.yml"

permissions:
  contents: read

concurrency:
  group: x1000-v24-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit-pmu:
    name: Audit PMU sans publication

    if: >-
      ${{
        github.ref == 'refs/heads/feature/installation-x1000-v2' ||
        github.ref == 'refs/heads/fix/x1000-v2-reparation-controlee'
      }}

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONPATH: "."

    steps:

      - name: Recuperer branche securisee
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verifier branche et syntaxe
        shell: bash
        run: |
          set -euo pipefail

          case "$GITHUB_REF" in
            refs/heads/feature/installation-x1000-v2|refs/heads/fix/x1000-v2-reparation-controlee)
              echo "Branche autorisee : $GITHUB_REF"
              ;;
            *)
              echo "::error::Branche non autorisee"
              exit 1
              ;;
          esac

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("audit_collecte_pmu.py")

          if not path.is_file():
              raise SystemExit("Script audit absent")

          if path.stat().st_size == 0:
              raise SystemExit("Script audit vide")

          ast.parse(
              path.read_text(encoding="utf-8-sig"),
              filename=str(path)
          )

          print("Syntaxe audit : OK")
          PY

      - name: Executer audit PMU reel
        shell: bash
        run: |
          set -euo pipefail

          python audit_collecte_pmu.py \
            > "$RUNNER_TEMP/audit-pmu.json"

      - name: Verifier rapport et securite
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          def require(condition, message):
              if not condition:
                  raise ValueError(message)

          def unique_pairs(pairs):
              result = {}
              for key, value in pairs:
                  require(
                      key not in result,
                      f"Cle dupliquee : {key}"
                  )
                  result[key] = value
              return result

          def invalid_constant(value):
              raise ValueError(
                  f"Constante JSON interdite : {value}"
              )

          report = (
              Path(os.environ["RUNNER_TEMP"])
              / "audit-pmu.json"
          )

          require(report.is_file(), "Rapport absent")

          require(
              0 < report.stat().st_size <= 65536,
              "Taille rapport invalide"
          )

          data = json.loads(
              report.read_text(encoding="utf-8-sig"),
              object_pairs_hook=unique_pairs,
              parse_constant=invalid_constant
          )

          require(
              isinstance(data, dict),
              "Objet attendu"
          )

          require(
              data.get("version") == "2.4",
              "Version incorrecte"
          )

          require(
              data.get("statut")
              == "AUDIT_SEUL_SANS_PUBLICATION",
              "Statut incorrect"
          )

          for key in (
              "publication",
              "fige",
              "validation_sportive"
          ):
              require(
                  data.get(key) is False,
                  f"{key} doit etre false"
              )

          for key in (
              "courses_france_verifiees",
              "courses_transmises_moteurs"
          ):
              require(
                  type(data.get(key)) is int
                  and data[key] == 0,
                  f"{key} doit etre zero"
              )

          for key in (
              "reunions",
              "courses_brutes"
          ):
              require(
                  type(data.get(key)) is int
                  and data[key] >= 0,
                  f"Compteur invalide : {key}"
              )

          require(
              isinstance(data.get("raison"), str)
              and bool(data["raison"].strip()),
              "Raison absente"
          )

          now = datetime.now(timezone.utc)
          paris = ZoneInfo("Europe/Paris")
          today = now.astimezone(paris).date()

          require(
              data.get("date") == today.isoformat(),
              "Date incorrecte"
          )

          expected = (
              "https://online.turfinfo.api.pmu.fr"
              "/rest/client/1/programme/"
              + today.strftime("%d%m%Y")
          )

          require(
              data.get("source") == expected,
              "URL source incorrecte"
          )

          digest = data.get("source_sha256")

          require(
              isinstance(digest, str)
              and re.fullmatch(
                  r"[0-9a-f]{64}", digest
              ) is not None,
              "SHA256 invalide"
          )

          collected = data.get("collecte_a")

          require(
              isinstance(collected, str),
              "Horodatage absent"
          )

          timestamp = datetime.fromisoformat(
              collected.replace("Z", "+00:00")
          )

          require(
              timestamp.tzinfo is not None
              and timestamp.utcoffset() is not None,
              "Fuseau absent"
          )

          require(
              abs((now - timestamp).total_seconds())
              <= 600,
              "Collecte hors tolerance"
          )

          require(
              timestamp.astimezone(paris).date()
              == today,
              "Date locale incoherente"
          )

          print("X1000 V2.4 : AUDIT CONFORME")
          print("Structure du rapport : OK")
          print("Publication : NON")
          print("FIGE : NON")
          print("Validation sportive : NON")
          print("M1-M5 : NON ALIMENTES")
          print(
              "Source declaree et empreinte "
              "controlees selon le rapport"
          )
          PY

      - name: Verifier depot inchange
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet ||
             ! git diff --cached --quiet; then
            echo "::error::Fichiers suivis modifies"
            exit 1
          fi

          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Fichiers non suivis crees"
            exit 1
          fi

          echo "Depot inchange : OK"

      - name: Bilan de securite
        if: success()
        shell: bash
        run: |
          {
            echo "## X1000 V2.4 - Audit PMU"
            echo ""
            echo "- Audit technique : conforme"
            echo "- Rapport JSON : controle"
            echo "- Empreinte SHA256 : format valide"
            echo "- M1-M5 : non alimentes"
            echo "- FIGE : aucun"
            echo "- Publication : aucune"
            echo "- Depot : inchange"
            echo "- Commit automatique : aucun"
            echo ""
            echo "Aucune validation sportive."
            echo "Aucune preuve independante de source."
          } >> "$GITHUB_STEP_SUMMARY"
