name: X1000 V2.5 - Diagnostic securise M1 a M5

run-name: Diagnostic controle sans publication

on:
  workflow_dispatch:
  push:
    branches:
      - fix/x1000-v2-reparation-controlee
    paths:
      - "m1.py"
      - "m2.py"
      - "m3.py"
      - "m4.py"
      - "m5.py"
      - "noyau_commun.py"
      - "moteurs/**"
      - "validation_moteurs.py"
      - "test_validation_moteurs.py"
      - "coordination_x1000.py"
      - "test_coordination_x1000.py"
      - ".github/workflows/diagnostic-moteurs.yml"

permissions:
  contents: read

concurrency:
  group: x1000-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    name: Verification securisee M1-M5
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Recuperer la branche
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Installer Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Controler la branche
        shell: bash
        run: |
          set -Eeuo pipefail

          BRANCH="${GITHUB_REF_NAME}"

          if [[ "$BRANCH" != \
            "fix/x1000-v2-reparation-controlee" ]]; then
            echo "::error::Branche non autorisee"
            exit 1
          fi

          python --version
          echo "Branche autorisee : $BRANCH"

      - name: Verifier les fichiers obligatoires
        shell: bash
        run: |
          set -Eeuo pipefail

          fichiers=(
            m1.py
            m2.py
            m3.py
            m4.py
            m5.py
            noyau_commun.py
            moteurs/noyau_commun.py
            validation_moteurs.py
            test_validation_moteurs.py
            coordination_x1000.py
            test_coordination_x1000.py
          )

          for fichier in "${fichiers[@]}"; do
            if [[ ! -f "$fichier" ]]; then
              echo "::error::Fichier absent : $fichier"
              exit 1
            fi
            echo "OK : $fichier"
          done

      - name: Verifier la syntaxe Python
        shell: bash
        run: |
          set -Eeuo pipefail

          python -B - <<'PY'
          import ast
          from pathlib import Path

          fichiers = [
              "m1.py",
              "m2.py",
              "m3.py",
              "m4.py",
              "m5.py",
              "noyau_commun.py",
              "moteurs/noyau_commun.py",
              "validation_moteurs.py",
              "test_validation_moteurs.py",
              "coordination_x1000.py",
              "test_coordination_x1000.py",
          ]

          for nom in fichiers:
              chemin = Path(nom)
              contenu = chemin.read_text(
                  encoding="utf-8-sig"
              )
              ast.parse(contenu, filename=nom)
              print("SYNTAXE OK :", nom)

          print("Controle syntaxique termine")
          PY

      - name: Preparer environnement temporaire
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$RUNNER_TEMP/x1000-tests"

          git archive HEAD | tar -x \
            -C "$RUNNER_TEMP/x1000-tests"

          echo "Copie temporaire preparee"
          echo "Depot original non modifie"

      - name: Executer tests dans copie temporaire
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$RUNNER_TEMP/x1000-tests"

          python -B test_validation_moteurs.py
          python -B test_coordination_x1000.py

          echo "Tests termines avec succes"

      - name: Controler integrite du depot
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Controle des modifications"

          git status --short

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Depot modifie"
            exit 1
          fi

          echo "Depot original inchange"

      - name: Bilan final
        if: success()
        shell: bash
        run: |
          echo "X1000 - DIAGNOSTIC REUSSI"
          echo "M1 a M5 : syntaxe controlee"
          echo "Tests de validation executes"
          echo "Tests de coordination executes"
          echo "Aucune publication par le workflow"
          echo "Aucun commit ni push"
          echo "Aucun FIGE automatique"
          echo "Aucun deploiement"
          echo "Depot original inchange"
