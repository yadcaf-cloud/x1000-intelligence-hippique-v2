name: X1000 - Recherche automatique quotidienne

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6,10,13,16 * * *"

permissions:
  contents: read

concurrency:
  group: x1000-recherche-quotidienne
  cancel-in-progress: false

jobs:
  recherche:
    name: Recherche courses PMU France - M1 a M5
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"

      X1000_READ_ONLY: "1"
      X1000_NO_FIGE: "1"
      X1000_NO_PUBLICATION: "1"

      X1000_BRANCHE_AUTORISEE: fix/x1000-v2-reparation-controlee

      X1000_SOURCE_URL: ${{ vars.X1000_SOURCE_URL }}
      X1000_SOURCE_HOST: online.turfinfo.api.pmu.fr

    steps:
      - name: Recuperer la branche autorisee
        uses: actions/checkout@v4
        with:
          ref: fix/x1000-v2-reparation-controlee
          persist-credentials: false
          clean: true

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verifier configuration et securite
        shell: bash
        run: |
          set -euo pipefail

          test "$GITHUB_REPOSITORY" = \
            "yadcaf-cloud/x1000-intelligence-hippique-v2"

          BRANCHE="$(git branch --show-current)"
          test "$BRANCHE" = "$X1000_BRANCHE_AUTORISEE"

          test "$X1000_READ_ONLY" = "1"
          test "$X1000_NO_FIGE" = "1"
          test "$X1000_NO_PUBLICATION" = "1"

          test -f recherche_courses_x1000.py
          test -f integration_x1000.py
          test -f validation_moteurs.py
          test -d moteurs

          python - <<'PY'
          import os
          from urllib.parse import urlsplit

          url = os.getenv("X1000_SOURCE_URL", "").strip()
          host = os.getenv("X1000_SOURCE_HOST", "").strip()

          if not url or not host:
              raise SystemExit("Source PMU absente")

          try:
              parsed = urlsplit(url)
              valid = (
                  parsed.scheme == "https"
                  and parsed.hostname == host
                  and parsed.port in (None, 443)
                  and not parsed.username
                  and not parsed.password
                  and not parsed.fragment
              )
          except ValueError:
              valid = False

          if not valid:
              raise SystemExit("Source HTTPS non autorisee")

          print("Configuration source : OK")
          PY

          echo "Branche autorisee : $BRANCHE"
          echo "Lecture seule : ACTIVE"
          echo "FIGE automatique : INTERDIT"
          echo "Publication : INTERDITE"

      - name: Recherche sportive et analyses M1-M5
        id: analyse
        shell: bash
        env:
          GITHUB_HEAD_REF: ""
          GITHUB_REF_NAME: fix/x1000-v2-reparation-controlee
        run: |
          set -euo pipefail

          BRANCHE="$(git branch --show-current)"

          if [ "$BRANCHE" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Branche non autorisee"
            exit 1
          fi

          echo "X1000 PHOENIX V2.4"
          echo "Recherche PMU France"
          echo "Moteurs : M1 M2 M3 M4 M5"
          echo "Coordination centrale active"

          python -B recherche_courses_x1000.py

      - name: Verifier integrite du depot
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          git diff --exit-code
          git diff --cached --exit-code

          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Fichiers non suivis detectes"
            exit 1
          fi

          echo "Integrite du depot : OK"

      - name: Bilan de securite
        if: always()
        shell: bash
        env:
          ANALYSE_RESULTAT: ${{ steps.analyse.outcome }}
        run: |
          {
            echo "## X1000 PHOENIX V2.4"
            echo ""
            echo "- Recherche PMU France"
            echo "- Moteurs M1 a M5"
            echo "- Coordination centrale"
            echo "- Branche controlee"
            echo "- Lecture seule active"
            echo "- Aucun FIGE automatique"
            echo "- Aucune publication"
            echo "- Aucun commit ou push"
            echo "- Aucun deploiement"
            echo ""
            echo "Resultat analyse : $ANALYSE_RESULTAT"
          } >> "$GITHUB_STEP_SUMMARY"
